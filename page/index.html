  const color = pcol ? pcol.value : null;
  if (!p){
    const nid = slug(name) + '-' + rand4();
    const order = S.projects.reduce((mx, q) => Math.max(mx, typeof q.order === 'number' ? q.order : 0), 0) + 10;
    const doc = { name, areaId, area: areaName, status, front, order, milestones: parsed.map(x => x.due ? { text: x.text, doneAt: null, due: x.due } : { text: x.text, doneAt: null }), waitingOn: [], links: [], docs, theme, color: color || SEQ[S.projects.length % SEQ.length], createdAt: t, updatedAt: t, lastMove: { date: t, text: 'Angelegt' } };
    if (home) doc.home = home;
    await write(() => S.db.doc('projects/' + nid).set(doc));
    await addMove(nid, t, 'Angelegt');
    if (!(front && status !== 'idee')){ S.tab = areaId; if (!areaById(areaId)) S.pendingTab = areaId; store('tab2', areaId); }
    S.drawer = { mode: 'project', id: nid, fresh: true }; S.moveOpen = false; render(); renderDrawer(true); toast('Projekt angelegt');
    return;
  }
  const old = Array.isArray(p.milestones) ? p.milestones : [];
  const used = new Set();
  const milestones = parsed.map((x, i) => {
    const text = x.text;
    let j = old.findIndex((m, k) => !used.has(k) && m.text === text);
    if (j < 0 && old[i] && !used.has(i) && !lines.includes(old[i].text)) j = i;
    const o = { text, doneAt: null };
    if (j >= 0){ used.add(j); o.doneAt = old[j].doneAt || null; }
    if (x.due) o.due = x.due;
    return o;
  });
  /* Wartet auf: „seit“ bleibt bei unveränderten Einträgen erhalten, neue Einträge bekommen das heutige Datum */
  const oldW = (p.waitingOn || []).filter(w => w && w.who);
  const usedW = new Set();
  const waitingOn = $('#fWait').value.split('\n').map(s => s.trim()).filter(Boolean).map(l => {
    const k = l.indexOf(':');
    const who = (k > 0 ? l.slice(0, k) : l).trim(), what = k > 0 ? l.slice(k + 1).trim() : '';
    let j = oldW.findIndex((w, i) => !usedW.has(i) && w.who === who && (w.what || '') === what);
    if (j < 0) j = oldW.findIndex((w, i) => !usedW.has(i) && w.who === who);
    const o = { who, what };
    if (j >= 0){ usedW.add(j); if (isISO(oldW[j].since)) o.since = oldW[j].since; }
    else o.since = t;
    return o;
  });
  const oldLinks = new Map((p.links || []).map(l => [l.to, l]));
  const links = Array.from(form.querySelectorAll('input[name="lk"]:checked')).map(i => oldLinks.get(i.value) || { to: i.value, label: '' });
  const upd = {
    name, areaId, area: areaName, status, front, milestones, waitingOn, links, docs, home, theme, color: color || colorKeyOf(p),
    nudgeAt: status === 'wartet' ? ($('#fNudge').value || null) : (p.nudgeAt || null),
    parkedUntil: status === 'geparkt' ? ($('#fPark').value || null) : (p.parkedUntil || null),
    updatedAt: t
  };
  /* Ein Statuswechsel ist eine Entscheidung und zählt als Bewegung (sonst wäre eine aktivierte Idee sofort rot) */
  const oldSt = p.status || 'aktiv';
  const stText = oldSt !== status ? 'Status: ' + stLabel(oldSt) + ' → ' + stLabel(status) : '';
  if (stText){ const prev = lastMoveOf(p); if (!prev || t >= prev.date) upd.lastMove = { date: t, text: stText }; }
  await write(() => S.db.doc('projects/' + id).update(upd));
  if (stText) await addMove(id, t, stText);
  S.drawer = { mode: 'project', id }; renderDrawer(true);
  const sq = stText && oldSt === 'idee' && status === 'aktiv' ? TH[theme].startQ : null;
  toast(sq ? '„' + sq[0] + '“ · ' + stText : (stText ? 'Gespeichert · ' + stText : 'Gespeichert'), sq ? 4200 : 2600);
}

/* Alle Bewegungen, auch über die 1000 hinaus, die die Seite live hält */
async function allMovesForExport(){
  const out = new Map();
  let before = null;
  for (let i = 0; i < 20; i++){
    const base = S.db.collection('moves');
    const q = before ? base.where('date', '<=', before).orderBy('date', 'desc').limit(1000) : base.orderBy('date', 'desc').limit(1000);
    const s = await q.get();
    const docs = s.docs.filter(x => x.exists);
    let added = 0;
    docs.forEach(x => { if (!out.has(x.id)){ out.set(x.id, Object.assign({ id: x.id }, x.data())); added++; } });
    if (docs.length < 1000 || !added) break;
    before = docs[docs.length - 1].data().date;
  }
  return Array.from(out.values());
}

/* Kalender (Connector „Google Calendar“) */
async function gcalCall(tool, input){
  try { return await S.mcp.callTool(GCAL, tool, input); }
  catch(e){
    if (e && e.retryable){ await sleep(Math.min(8000, e.retryAfterMs || (700 + Math.random() * 700))); return await S.mcp.callTool(GCAL, tool, input); }
    throw e;
  }
}
function gcalErr(e){
  const c = e && e.code;
  if (c === 'server_not_connected') return 'Google Kalender ist nicht verbunden. In claude.ai unter Einstellungen → Connectors hinzufügen.';
  if (c === 'needs_reauth') return 'Google Kalender bitte neu verbinden: claude.ai → Einstellungen → Connectors.';
  if (c === 'not_in_manifest' || c === 'consent_required') return 'Der Kalenderzugriff ist für diese Seite nicht erlaubt. Beim nächsten Versuch fragt Claude noch einmal.';
  if (c === 'selection_required') return 'Es gibt mehrere Google-Kalender-Verbindungen. Bitte in der Abfrage von Claude eine auswählen.';
  if (c === 'blocked_by_policy' || c === 'approval_required') return 'Deine Organisation erlaubt diesen Zugriff hier nicht.';
  if (c === 'server_unavailable' || c === 'rate_limited') return 'Der Kalender ist gerade nicht erreichbar. Später noch einmal versuchen.';
  if (c === 'tool_error') return 'Der Kalender meldet einen Fehler' + (e.message ? ': ' + e.message : '.');
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Kalenderzugriff ist in dieser Ansicht nicht verfügbar.';
  return 'Kalender nicht erreichbar' + (c ? ' (' + c + ')' : '') + '.';
}
function localYMD(v){ const d = new Date(v); return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function localHM(v){ const d = new Date(v); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function gcalNorm(e){
  if (!e || !e.id || e.status === 'cancelled') return null;
  const s = e.start || {}, en = e.end || {};
  let date = '', endDate = null, time = '';
  if (s.date){ date = String(s.date).slice(0, 10); if (en.date){ const last = addDays(String(en.date).slice(0, 10), -1); if (last > date) endDate = last; } }
  else if (s.dateTime){ date = localYMD(s.dateTime); time = localHM(s.dateTime); if (en.dateTime){ const ed = localYMD(en.dateTime); if (ed > date) endDate = ed; } }
  if (!isISO(date)) return null;
  return { id: String(e.id), title: String(e.summary || '(ohne Titel)'), date, endDate, time, link: /^https:\/\//i.test(e.htmlLink || '') ? String(e.htmlLink) : '' };
}
async function gcalFetch(cal, from, to){
  const out = []; let token = null, summary = '';
  for (let i = 0; i < 5; i++){
    const input = { startTime: from + 'T00:00:00', endTime: to + 'T00:00:00', orderBy: 'startTime', pageSize: 250 };
    if (cal && cal !== 'primary') input.calendarId = cal;
    if (token) input.pageToken = token;
    const r = await gcalCall('list_events', input);
    const p = (r && r.payload) || {};
    if (!summary && p.summary) summary = String(p.summary);
    (Array.isArray(p.events) ? p.events : []).forEach(e => { const n = gcalNorm(e); if (n) out.push(n); });
    token = p.nextPageToken; if (!token) break;
  }
  return { list: out, summary };
}
/* Übernommene Termine nachziehen: Datum folgt dem Kalender; was im Zeitraum fehlt, wird markiert */
async function gcalSync(list, from, to, cal){
  const byId = new Map(list.map(x => [x.id, x]));
  for (const ev of S.events.filter(e => e.gcal && e.gcal.id && (e.gcal.cal || 'primary') === (cal || 'primary'))){
    const g = byId.get(String(ev.gcal.id));
    if (g){
      const upd = {};
      if (g.date !== ev.date) upd.date = g.date;
      if ((g.endDate || null) !== (ev.endDate || null)) upd.endDate = g.endDate || null;
      if (ev.gcal.missing) upd.gcal = Object.assign({}, ev.gcal, { missing: null });
      if (Object.keys(upd).length){ upd.updatedAt = today(); try { await S.db.doc('events/' + ev.id).update(upd); } catch(e){} }
    } else if (ev.date >= from && ev.date < to && !ev.gcal.missing){
      try { await S.db.doc('events/' + ev.id).update({ gcal: Object.assign({}, ev.gcal, { missing: today() }), updatedAt: today() }); } catch(e){}
    }
  }
}
async function gcalLoad(){
  const g = S.gcal; if (!g || !S.mcp) return;
  g.status = 'loading'; g.err = ''; g.open = null;
  if (S.drawer && S.drawer.mode === 'gcal') renderDrawer(true);
  try {
    if (!g.cals){
      const r = await gcalCall('list_calendars', { pageSize: 100 });
      const p = (r && r.payload) || {};
      g.cals = (Array.isArray(p.calendars) ? p.calendars : []).filter(c => c && c.id && !/#(weeknum|holiday|contacts)@/i.test(String(c.id)));
    }
    const t = today(), to = addDays(t, 56);
    const res = await gcalFetch(g.cal || 'primary', t, to);
    if (!g.cal && res.summary) g.primary = res.summary;
    g.events = res.list; g.status = 'ready';
    await gcalSync(res.list, t, to, g.cal || 'primary');
  } catch(e){ g.status = 'error'; g.err = gcalErr(e); }
  if (S.drawer && S.drawer.mode === 'gcal') renderDrawer(true);
}
/* Beim Öffnen der Termine: still nachziehen, aber nur wenn der Zugriff schon erlaubt ist (keine Abfrage) */
async function gcalAutoSync(){
  if (S.gcalSynced || !S.mcp || !S.perm) return;
  const imp = S.events.filter(e => e.gcal && e.gcal.id && isISO(e.date));
  if (!imp.length) return;
  let st = 'unavailable';
  try { st = await S.perm.state('mcp:' + GCAL); } catch(e){ st = 'unavailable'; }
  if (st !== 'granted') return;
  S.gcalSynced = true;
  const t = today();
  const cals = Array.from(new Set(imp.map(e => e.gcal.cal || 'primary')));
  for (const cal of cals){
    const mine = imp.filter(e => (e.gcal.cal || 'primary') === cal);
    const from = addDays(t, -14);
    let last = addDays(mine.reduce((m, e) => endOf(e) > m ? endOf(e) : m, t), 60);
    if (diff(t, last) > 400) last = addDays(t, 400);
    const to = addDays(last, 1);
    try { const res = await gcalFetch(cal, from, to); await gcalSync(res.list, from, to, cal); } catch(e){}
  }
}

document.addEventListener('submit', async ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'qnForm'){ const v = ($('#qnText').value || '').trim(); if (v && S.sample) qnAsk(v); return; }
  if (S.saving) return;
  S.saving = true;
  const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'moveForm') await saveMove();
    else if (f.id === 'projForm') await saveProject(f);
    else if (f.id === 'areaForm') await saveArea(f);
    else if (f.id === 'eventForm') await saveEvent(f);
    else if (f.id === 'pauseForm') await savePause();
    else if (f.id === 'fadenForm') await saveFaden(f);
    else if (f.id === 'menschForm') await savePerson(f);
    else if (f.id === 'gedankeForm') await saveGedanke(f);
    else if (f.id === 'feldForm') await saveFeld(f);
    else if (f.id === 'dokForm') await saveDokument(f);
    else if (f.id === 'themaForm') await saveThema(f);
    else if (f.id === 'rhForm') await saveRhythmus(f);
  } catch(e){ /* Hinweis wurde schon gezeigt */ }
  finally { S.saving = false; if (btn && document.contains(btn)) btn.disabled = false; }
});

  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === 'k' || ev.key === 'K') && ready()){ ev.preventDefault(); if (!(S.drawer && S.drawer.mode === 'suche')) openDrawer({ mode: 'suche' }, '#suQ'); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && tg && tg.closest && tg.closest('.km-n[data-act]')){ ev.preventDefault(); tg.closest('.km-n').dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (ev.key === 'Escape' && document.body.classList.contains('qn-open') && !S.drawer){ qnSheetClose(); return; }
  if (ev.key === 'Escape' && S.qn && !S.drawer){ if (S.qn.ctl) S.qn.ctl.abort(); S.qn = null; renderQn(); return; }
  if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')){
    const row = tg && tg.closest ? tg.closest('.rows > .row[data-pid]') : null; if (!row) return;
    ev.preventDefault();
    const rows = Array.from(row.parentElement.children).filter(r => r.classList.contains('row') && r.dataset.pid);
    const i = rows.indexOf(row), j = i + (ev.key === 'ArrowUp' ? -1 : 1);
    if (i < 0 || j < 0 || j >= rows.length) return;
    const ids = rows.map(r => r.dataset.pid); ids.splice(i, 1); ids.splice(j, 0, row.dataset.pid);
    S.focusRow = row.dataset.pid;
    saveProjectOrder(ids);
  }
});

/* ---------- Start ---------- */
cacheLoad();
render();
(async function boot(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ S.unavailable = true; dbReady(null); render(); return; }
  let db = null;
  try { db = await c.use('db'); } catch(e){ db = null; }
  if (!db){ S.unavailable = true; dbReady(null); render(); return; }
  S.db = db; dbReady(db);
  const onErr = e => { if (e && e.code === 'revoked') S.unavailable = true; toast('Verbindung unterbrochen. Seite neu laden.'); render(); };
  const sub = (col, key, q) => (q || db.collection(col)).onSnapshot(s => {
    S[key] = s.docs.filter(x => x.exists).map(x => Object.assign({ id: x.id }, x.data()));
    S.loaded[key] = true; S.live[key] = true; S.memo = null;
    if (key === 'areas') checkOverride();
    if (key === 'moves') S.recStart = S.moves.reduce((m, x) => isISO(x.date) && (!m || x.date < m) ? x.date : m, null);
    render();
    cacheSave();
  }, onErr);
  sub('areas', 'areas');
  sub('projects', 'projects');
  sub('moves', 'moves', db.collection('moves').orderBy('date', 'desc').limit(1000));
  sub('events', 'events');
  sub('arbeitsstaende', 'ast');
  sub('pausen', 'pauses');
  sub('personen', 'personen');
  sub('faeden', 'faeden');
  sub('felder', 'felder');
  sub('gedanken', 'gedanken');
  sub('dokumente', 'dokumente');
  sub('rhythmen', 'rhythmen');
  sub('meta', 'meta');
  c.use('assets').then(x => { S.assets = x || null; }).catch(() => {});
  c.use('sample').then(x => { S.sample = x || null; renderQn(); renderBar(); }).catch(() => {});
  c.use('downloads').then(x => { S.dl = x; renderFooter(); }).catch(() => {});
  c.use('permissions').then(x => { S.perm = x || null; }).catch(() => {});
  c.use('mcp').then(x => { S.mcp = x || null; if (S.mcp && S.drawer && S.drawer.mode === 'dates') renderDrawer(true); }).catch(() => {});
})();
})();
