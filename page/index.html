function contactMix(age, takt){
  if (age == null) return null;
  const f = age / (TAKT[takt] || TAKT.monat);
  if (f <= 0.25) return 100;
  return Math.max(25, Math.round(100 - (f - 0.25) / 1.25 * 75));
}
function personWarn(x, t){ return openThreads().some(f => f.personId === x.id && threadLvl(f, t) === 'warn'); }
function agoText(age){
  if (age == null) return 'noch nichts';
  if (age <= 0) return 'heute';
  if (age === 1) return 'gestern';
  if (age < 14) return 'vor ' + age + ' T';
  if (age < 60) return 'vor ' + Math.round(age / 7) + ' Wo.';
  if (age < 365) return 'vor ' + Math.round(age / 30) + ' Mon.';
  return 'vor über einem Jahr';
}
function agoLong(age){
  if (age == null) return 'noch nichts eingetragen';
  if (age <= 0) return 'heute';
  if (age === 1) return 'gestern';
  if (age < 14) return 'vor ' + age + ' Tagen';
  if (age < 60){ const w = Math.round(age / 7); return 'vor ' + w + (w === 1 ? ' Woche' : ' Wochen'); }
  if (age < 365){ const m = Math.round(age / 30); return 'vor ' + m + (m === 1 ? ' Monat' : ' Monaten'); }
  return 'vor über einem Jahr';
}

function sinnSVG(k, size, sw){ const s = SINN[k] || SINN.lampe; return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.5) + '" stroke-linecap="round" stroke-linejoin="round">' + s.svg + '</svg>'; }
function felderIn(aid){ return S.felder.filter(f => f && f.name && f.areaId === aid).sort(byOrder); }

function gFeld(g){ const o = S.rmove[g.id]; if (o && o === g.feldId) delete S.rmove[g.id]; return S.rmove[g.id] || g.feldId || null; }

/* Lage eines Feldes; ohne gespeicherte Lage ein Raster nach Reihenfolge */
function feldPos(f, i){
  const o = S.rpos[f.id];

  const p = S.rpos[f.id] || f;
  return { x: typeof p.x === 'number' ? p.x : RF_P + (i % 3) * (RF_W + RF_G), y: typeof p.y === 'number' ? p.y : RF_P + Math.floor(i / 3) * 240 };
}
/* Freier Platz für ein neues Feld: erste Lücke im Raster, von oben nach unten */
function freeSpot(aid){
  const W = Math.max(2 * RF_W + 3 * RF_P, S.rW || 1000);
  const rects = S.rArea === aid && S.rRects ? S.rRects : felderIn(aid).map((f, i) => { const p = feldPos(f, i); return { x: p.x, y: p.y, w: RF_W, h: 220 }; });
  const cols = Math.max(1, Math.floor((W - RF_P) / (RF_W + RF_G))), H = 220;
  for (let y = RF_P; y < 6000; y += 20){
    for (let c = 0; c < cols; c++){
      const x = RF_P + c * (RF_W + RF_G);
      if (x + RF_W + RF_P > W) continue;
      if (!rects.some(r => x < r.x + r.w + RF_G && x + RF_W + RF_G > r.x && y < r.y + r.h + RF_G && y + H + RF_G > r.y)) return { x, y };

  }
  return { x: RF_P, y: rects.reduce((m, r) => Math.max(m, r.y + r.h), 0) + RF_G };
}

/* Wenn mehreres liegt: womit anfangen (nächster Termin, wie viele Projekte warten darauf, wie lange schon) */
function pickStart(t){

  c.forEach(x => {

  });

/* Wochenpuls C: Bewegungstage je Woche, vier Wochen, rechts die laufende */

function safeUrl(u){ const s = String(u || '').trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(s) ? s : ''; }
function tgt(url){ return /^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : ''; }
function linkKind(url){
  const u = String(url || '').trim();
  if (/^mailto:/i.test(u)) return { k: 'mail', name: 'Mail', verb: 'Schreiben' };
  if (/^tel:/i.test(u)) return { k: 'tel', name: 'Telefon', verb: 'Anrufen' };
  let host = '', path = '';
  try { const x = new URL(u); host = x.hostname.replace(/^www\./, '').toLowerCase(); path = x.pathname.toLowerCase(); } catch(e){ return { k: 'link', name: 'Link', verb: 'Öffnen' }; }
  if (host === 'claude.ai' || host.endsWith('.claude.ai')) return { k: 'claude', name: 'Claude', verb: 'Weiterarbeiten' };
  if (host === 'docs.google.com'){
    if (path.startsWith('/spreadsheets')) return { k: 'sheet', name: 'Google Tabelle', verb: 'Öffnen' };
    if (path.startsWith('/presentation')) return { k: 'slides', name: 'Google Präsentation', verb: 'Öffnen' };
    return { k: 'doc', name: 'Google Doc', verb: 'Öffnen' };
  }
  if (host === 'drive.google.com') return path.includes('/folders/') ? { k: 'folder', name: 'Drive-Ordner', verb: 'Öffnen' } : { k: 'doc', name: 'Drive', verb: 'Öffnen' };
  if (host.endsWith('dropbox.com')) return { k: (path.startsWith('/home') || path.includes('/scl/fo/')) ? 'folder' : 'doc', name: 'Dropbox', verb: 'Öffnen' };
  if (host.endsWith('sharepoint.com') || host === 'onedrive.live.com' || host === '1drv.ms') return { k: 'folder', name: 'OneDrive', verb: 'Öffnen' };
  if (host.endsWith('craft.do')) return { k: 'doc', name: 'Craft', verb: 'Öffnen' };
  if (host.endsWith('notion.so') || host.endsWith('notion.site')) return { k: 'doc', name: 'Notion', verb: 'Öffnen' };
  if (host === 'wa.me' || host.endsWith('whatsapp.com')) return { k: 'mail', name: 'WhatsApp', verb: 'Schreiben' };
  if (host === 'osf.io') return { k: 'link', name: 'OSF', verb: 'Öffnen' };
  if (host === 'github.com') return { k: 'link', name: 'GitHub', verb: 'Öffnen' };
  if (/\.pdf$/.test(path)) return { k: 'doc', name: 'PDF', verb: 'Öffnen' };
  return { k: 'link', name: host || 'Link', verb: 'Öffnen' };
}

/* Soll laut Plan: Linie durch die Soll-Daten der Meilensteine. Nur Anzeige, nie Alarm. */
function fDue(s){ return fDM(s) + (String(s).slice(0, 4) !== today().slice(0, 4) ? String(s).slice(2, 4) : ''); }
/* Soll-Datum aus dem Formular: '' → null, unlesbar → undefined */
function sollOf(p, mi, t){
  if (!mi.total || p.status === 'fertig' || p.status === 'idee' || mi.cur < 0) return null;
  const pts = [];
  mi.ms.forEach((m, i) => { if (isISO(m.due)) pts.push({ d: m.due, v: (i + 1) / mi.total, i }); });
  if (!pts.length) return null;
  const first = pts[0];
  pts.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.v - b.v);
  const start = isISO(p.planAt) ? p.planAt : (isISO(p.createdAt) ? p.createdAt : null);
  if (start && start < pts[0].d) pts.unshift({ d: start, v: first.i / mi.total });
  for (let i = 1; i < pts.length; i++) if (pts[i].v < pts[i - 1].v) pts[i].v = pts[i - 1].v;
  let v = null;
  if (t >= pts[pts.length - 1].d) v = pts[pts.length - 1].v;
  else for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1];
    if (t >= a.d && t < b.d){ const span = diff(a.d, b.d); v = span > 0 ? a.v + (b.v - a.v) * diff(a.d, t) / span : b.v; break; }
  }
  if (v == null || v <= 0) return null;
  const late = mi.ms.find(m => !m.doneAt && isISO(m.due) && m.due < t) || null;
  const next = mi.ms.find(m => !m.doneAt && isISO(m.due) && m.due >= t) || null;
  return { v: Math.min(1, v), late, next };
}
function sollText(so){ return so.late ? 'Soll: „' + so.late.text + '“ bis ' + fDue(so.late.due) + ', drüber' : so.next ? 'Soll: „' + so.next.text + '“ bis ' + fDue(so.next.due) : 'im Plan'; }

/* Planvorschlag eines Fachprojekts: Meilensteine, die Rafael mit einem Tipp übernimmt */
function planOf(p){
  const pp = p && p.planProposal;
  if (!pp || typeof pp !== 'object' || !Array.isArray(pp.milestones)) return null;
  const ms = pp.milestones.map(m => typeof m === 'string' ? { text: m } : m).filter(m => m && String(m.text || '').trim()).map(m => {
    const o = { text: String(m.text).trim() };
    if (Object.prototype.hasOwnProperty.call(m, 'due')) o.due = isISO(m.due) ? m.due : null;
    return o;
  });
  if (!ms.length) return null;
  return { ms, by: String(pp.by || pp.source || '').trim(), at: isISO(pp.at) ? pp.at : '', note: String(pp.note || '').trim() };
}
function planDiff(p, plan){
  const old = msInfo(p).ms;
  const used = new Set();
  const rows = plan.ms.map((m, i) => {
    const j = old.findIndex((o, k) => !used.has(k) && o.text === m.text);
    const last = i === plan.ms.length - 1;
    if (j >= 0){
      used.add(j);
      const o = old[j];
      const due = Object.prototype.hasOwnProperty.call(m, 'due') ? m.due : (isISO(o.due) ? o.due : null);
      return { kind: 'keep', text: m.text, due, oldDue: isISO(o.due) ? o.due : null, doneAt: o.doneAt || null, last };
    }
    return { kind: 'add', text: m.text, due: m.due || null, oldDue: null, doneAt: null, last };
  });
  const removed = old.filter((o, k) => !used.has(k)).map(o => ({ kind: 'del', text: o.text, doneAt: o.doneAt || null }));
  return { rows, removed, nOld: old.length, nNew: rows.length, nAdd: rows.filter(r => r.kind === 'add').length, nDel: removed.length };
}
function planSection(p){
  const plan = planOf(p); if (!plan) return '';
  const dfx = planDiff(p, plan);
  const meta = 'von Claude' + (plan.by ? ' · ' + plan.by : '') + (plan.at ? ' · ' + fDM(plan.at) : '') + ' · ' + dfx.nOld + ' → ' + dfx.nNew + ' Meilensteine' +
    (dfx.nAdd ? ', ' + dfx.nAdd + ' neu' : '') + (dfx.nDel ? ', ' + dfx.nDel + (dfx.nDel === 1 ? ' entfällt' : ' entfallen') : '');
  const right = r => {
    if (r.kind === 'add') return esc('neu' + (r.last ? ' · Ziel' : '') + (r.due ? ' · bis ' + fDue(r.due) : ''));
    let s = esc(r.doneAt ? 'erreicht ' + fDM(r.doneAt) : (r.due ? 'bis ' + fDue(r.due) : (r.last ? 'Ziel' : '')));
    if (r.due !== r.oldDue && !r.doneAt){
      if (r.oldDue) s += ' <span class="was">' + esc(r.due ? '(bisher ' + fDue(r.oldDue) + ')' : '(Soll ' + fDue(r.oldDue) + ' entfällt)') + '</span>';
      else if (r.due) s += esc(' · Soll neu');
    }
    return s;
  };
  const rows = dfx.rows.map(r => '<span class="sg' + (r.kind === 'add' ? ' add' : '') + '" aria-hidden="true">' + (r.kind === 'add' ? '+' : '=') + '</span><span class="pt' + (r.kind === 'add' ? ' add' : '') + '">' + esc(r.text) + (r.kind === 'add' ? '<span class="sr"> (neu)</span>' : '') + '</span><span class="pr">' + right(r) + '</span>').join('') +
    dfx.removed.map(r => '<span class="sg del" aria-hidden="true">−</span><span class="pt del">' + esc(r.text) + '<span class="sr"> (entfällt)</span></span><span class="pr del">entfällt' + (r.doneAt ? ' · war erreicht' : '') + '</span>').join('');
  return '<section class="planbox" aria-labelledby="planH"><div><p class="plan-h" id="planH">Neuer Plan vorgeschlagen</p><p class="plan-m">' + esc(meta) + '</p></div>' +
    (plan.note ? '<p class="plan-n">' + esc(plan.note) + '</p>' : '') +
    '<div class="plan-l">' + rows + '</div>' +
    '<div class="dr-actions"><button class="btn primary" type="button" data-act="plan-accept">Übernehmen</button><button class="btn ghost" type="button" data-act="plan-reject">Verwerfen</button></div></section>';
}

function mdInline(s){
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text){
  const lines = String(text || '').split('\n');
  let out = '', list = null, table = [];
  const flushList = () => { if (list){ out += '</' + list + '>'; list = null; } };
  const flushTable = () => { if (table.length){ out += '<div class="md-table"><pre>' + table.join('\n') + '</pre></div>'; table = []; } };
  for (const raw of lines){
    const line = raw.replace(/\s+$/, '');
    if (/^\s*\|/.test(line)){ flushList(); table.push(esc(line)); continue; }
    flushTable();
    if (!line.trim()){ flushList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))){ flushList(); const lv = Math.min(6, m[1].length + 3); out += '<h' + lv + ' class="md-h">' + mdInline(esc(m[2])) + '</h' + lv + '>'; continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))){ if (list !== 'ul'){ flushList(); out += '<ul>'; list = 'ul'; } out += '<li>' + mdInline(esc(m[1])) + '</li>'; continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))){ if (list !== 'ol'){ flushList(); out += '<ol>'; list = 'ol'; } out += '<li>' + mdInline(esc(m[1])) + '</li>'; continue; }
    flushList(); out += '<p>' + mdInline(esc(line)) + '</p>';
  }
  flushList(); flushTable();
  return out;
}
function kopfOf(text){
  const lines = String(text || '').split('\n');
  const i = lines.findIndex(l => /^##\s+Kopf\b/i.test(l));
  if (i < 0) return lines.slice(0, 8).join('\n');
  const out = [];
  for (let j = i + 1; j < lines.length; j++){ if (/^##\s/.test(lines[j])) break; out.push(lines[j]); }
  return out.join('\n');
}

function alerts(t){
  const items = [];
  S.projects.filter(isLive).forEach(p => {
    const h = health(p, t);
    if (h.lvl === 'crit') items.push({ lvl: 'crit', pid: p.id, title: p.name, sub: h.label, sort: 0, color: colorOf(p) });
    else if (h.lvl === 'warn') items.push({ lvl: 'warn', pid: p.id, title: p.name, sub: h.label, sort: 2, color: colorOf(p) });
  });
  upcoming(t).forEach(e => {
    /* Pläne aus den Fäden-Bereichen stehen auf ihrem Zeitband und unter „Termine“, nicht in der Glocke */
    if (e.kind === 'ungefaehr' || (e.areaId && !e.projectId)) return;
    const d = diff(t, e.date);
    if (d < 0 || d > 2) return;
    const p = projById(e.projectId);
    items.push({ lvl: 'due', eid: e.id, title: e.title, sub: dueWord(d) + ', ' + fShortY(e.date) + (p ? ' · ' + p.name : ''), sort: 1, color: p ? colorOf(p) : 'var(--accent)' });
  });
  return items.sort((a, b) => a.sort - b.sort);
}

/* Pfeile an den Rändern, wenn Reiter verdeckt sind; der Punkt zeigt, ob dahinter etwas liegt */
function updateTabArrows(){

  const max = box.scrollWidth - box.clientWidth, sl = box.scrollLeft;
  const showL = sl > 2, showR = sl < max - 2;
  const br = box.getBoundingClientRect();
  let sigL = '', sigR = '';
  box.querySelectorAll('.tab .sig').forEach(s => {
    const r = s.closest('.tab').getBoundingClientRect(), lv = s.classList.contains('warn') ? 'warn' : 'crit';

/* Felder frei auf der Fläche: gespeicherte Lage, aber nie übereinander (wer im Weg liegt, rückt nach unten). Schmal: untereinander. */
let boardObserver = null;
function watchBoard(){
  if (boardObserver){ boardObserver.disconnect(); boardObserver = null; }
  const box = $('#rboard'); if (!box){ S.rArea = null; return; }
  S.rArea = box.dataset.area;
  layoutBoard();
  if (!window.ResizeObserver) return;
  let lastW = box.clientWidth;
  boardObserver = new ResizeObserver(() => { const w = box.clientWidth; if (w !== lastW){ lastW = w; layoutBoard(); } });
  boardObserver.observe(box);
}
function layoutBoard(){
  const box = $('#rboard'); if (!box || box.classList.contains('empty')) return;
  const W = box.clientWidth; if (!W) return;
  S.rW = W;
  const stack = W < 2 * RF_W + 3 * RF_P;
  box.classList.toggle('stack', stack);
  if (stack){ box.style.height = ''; S.rRects = null; return; }
  const items = Array.from(box.querySelectorAll('.rf')).map(el => ({ el, v: el.dataset.virtual === '1', x: Math.max(RF_P, Math.min(W - RF_W - RF_P, +el.dataset.x || RF_P)), y: Math.max(RF_P, +el.dataset.y || RF_P), h: el.offsetHeight }));
  const placed = [];
  const hits = (it, y) => placed.filter(p => it.x < p.x + RF_W + RF_G && it.x + RF_W + RF_G > p.x && y < p.y + p.h + RF_G && y + it.h + RF_G > p.y);
  items.filter(i => !i.v).sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach(it => {
    let y = it.y, hs = hits(it, y), guard = 0;
    while (hs.length && guard++ < 400){ y = Math.max.apply(null, hs.map(p => p.y + p.h + RF_G)); hs = hits(it, y); }
    it.y = y; placed.push(it);
  });
  items.filter(i => i.v).forEach(it => { it.x = RF_P; it.y = placed.reduce((m, p) => Math.max(m, p.y + p.h + RF_G), RF_P); placed.push(it); });
  placed.forEach(it => { if (!it.el.classList.contains('lift')){ it.el.style.left = it.x + 'px'; it.el.style.top = it.y + 'px'; } });
  box.style.height = Math.max(340, placed.reduce((m, p) => Math.max(m, p.y + p.h), 0) + RF_P) + 'px';
  S.rRects = placed.filter(p => !p.v).map(p => ({ id: p.el.dataset.id, x: p.x, y: p.y, w: RF_W, h: p.h }));
}

/* ---------- Bibliothek (Version 12): Recherchen als Regal ----------
   Je Bereich ein Regal: Themen (felder) alphabetisch, getrennt durch Buchstützen; jedes Dokument ein Buchrücken, neue Bände rechts.
   Farbe des Rückens = Art, Breite = Umfang, Höhe nach Titel und Zufall (fest je Dokument). Patina: Leder, Bünde, Rückenschild, abgeriebenes Gold, Flecken.
   Auf dem Lesetisch liegen die zwei neuesten Bände aufgeschlagen; ein angeklickter Band liegt vorn (S.bsel je Bereich).
   Altern je Bereich (areas.altert in Tagen, 0 oder fehlt = nie): danach blasser, mit Staub und Stempel „Stand Juli“. Nie gelb oder rot, nichts in der Glocke. */
const DOC_ART = { dossier: { name: 'Dossier', c: 'granat' }, ueberblick: { name: 'Überblick', c: 'petrol' }, vergleich: { name: 'Vergleich', c: 'indigo' }, faktencheck: { name: 'Faktencheck', c: 'ocker' }, analyse: { name: 'Analyse', c: 'moos' }, chronik: { name: 'Chronik', c: 'kupfer' } };
const DOC_ART_ORDER = ['dossier', 'ueberblick', 'vergleich', 'faktencheck', 'analyse', 'chronik'];
const UMFANG = { kurz: { name: 'kurz', w: 24 }, mittel: { name: 'mittel', w: 32 }, umfangreich: { name: 'umfangreich', w: 42 } };
const UMFANG_ORDER = ['kurz', 'mittel', 'umfangreich'];
const ALTERT = [[0, 'nie'], [90, 'nach 3 Monaten'], [180, 'nach 6 Monaten'], [365, 'nach 12 Monaten']];

function docsIn(aid){ return S.dokumente.filter(d => d && d.titel && d.areaId === aid); }
function docById(id){ return id ? S.dokumente.find(d => d.id === id) || null : null; }
function docArt(d){ return d && DOC_ART[d.art] ? d.art : 'dossier'; }
function docUmf(d){ return d && UMFANG[d.umfang] ? d.umfang : 'mittel'; }
function docStand(d){ return isISO(d.stand) ? d.stand : (dayOf(d.createdAt) || today()); }
function altertOf(a){ const n = a ? Math.round(Number(a.altert)) : 0; return n > 0 ? n : 0; }
function altertName(n){ const x = ALTERT.find(o => o[0] === n); return x ? x[1] : 'nach ' + n + ' Tagen'; }
function docOld(d, a, t){ const n = altertOf(a); return n > 0 && diff(docStand(d), t) > n; }
/* neueste zuerst: Stand, dann Zeitpunkt des Eintrags */
function docNewer(p, q){ return docStand(q).localeCompare(docStand(p)) || String(q.createdAt || '').localeCompare(String(p.createdAt || '')); }
function docSince(d){ return dayOf(d.createdAt) || docStand(d); }
/* Heute aufgeschlagen: ab vier Bänden einmal am Tag ein älterer (mindestens vier Wochen eingetragen, nicht unter den zwei neuesten) */
function revivedDoc(a, sorted, t){
  if (sorted.length < 4) return null;
  const top = new Set(sorted.slice(0, 2).map(d => d.id));
  const cand = sorted.filter(d => !top.has(d.id) && diff(docSince(d), t) >= 28);
  return cand.length ? cand[hashStr(t + '|' + a.id) % cand.length] : null;
}
/* Tisch: vorne der gewählte oder neueste Band, daneben der Band von heute (sonst der zweitneueste); der Band von heute bleibt den Tag über derselbe */
function deskDocs(a, ds, t){
  const sorted = ds.slice().sort(docNewer);
  const pick = S.bsel[a.id] ? sorted.find(d => d.id === S.bsel[a.id]) : null;
  const first = pick || sorted[0];
  if (!first) return [];
  const hv = revivedDoc(a, sorted, t || today());
  const second = hv && hv !== first ? hv : (sorted.find(d => d !== first) || null);
  return [{ d: first, hv: first === hv }].concat(second ? [{ d: second, hv: second === hv }] : []);
}
function bibTopics(aid){ return felderIn(aid).slice().sort((p, q) => String(p.name).localeCompare(String(q.name), 'de')); }
/* Inschrift: in römischen Großbuchstaben, V statt U, Wörter mit Mittelpunkt */
function inscrCaps(la){ return String(la || '').replace(/[„“”"'.,;:!?«»()]/g, ' ').trim().toLocaleUpperCase('de').replace(/U/g, 'V').split(/\s+/).filter(Boolean).join(' · '); }
/* Titel auf dem Rücken: ganz, wenn er passt; sonst der Teil vor dem Doppelpunkt; notfalls kleiner, zuletzt gekürzt */
let spCtx = null, biFontTried = false;
function spW(x, px){
  if (spCtx === null){ try { spCtx = document.createElement('canvas').getContext('2d') || false; } catch(e){ spCtx = false; } }
  if (!spCtx) return x.length * px * 0.78;
  spCtx.font = '600 ' + px + 'px Cinzel, "EB Garamond", Georgia, serif';
  return spCtx.measureText(x).width + x.length * 0.07 * px;
}
function wrapSpine(txt, cols, max, px){
  const toks = [];
  txt.split(/\s+/).filter(Boolean).forEach(wd => wd.split(/(?<=[-–])/).forEach((part, i) => toks.push({ t: part, glue: i > 0 })));
  const lines = []; let cur = '';
  toks.forEach(k => {
    const next = cur ? cur + (k.glue ? '' : ' ') + k.t : k.t;
    if (!cur || spW(next, px) <= max){ cur = next; return; }
    lines.push(cur); cur = k.t;
  });
  if (cur) lines.push(cur);
  if (lines.length <= cols && lines.every(l => spW(l, px) <= max)) return { fit: true, lines };
  const out = lines.slice(0, cols).map((l, i, arr) => {
    if (spW(l, px) <= max && !(lines.length > cols && i === arr.length - 1)) return l;
    let x = l; while (x.length > 1 && spW(x + '…', px) > max) x = x.slice(0, -1);
    return x.replace(/[\s:,;–-]+$/, '') + '…';
  });
  return { fit: false, lines: out };
}
function spineFit(title, cols, max, topic){
  const full = String(title || '').trim().toLocaleUpperCase('de');
  const parts = full.split(/\s*:\s+|\s+[–—-]\s+/);
  const short = parts.length > 1 && parts[0].length >= 6 && parts[0] !== String(topic || '').toLocaleUpperCase('de') ? parts[0] : '';
  const tries = [[full, 9], short ? [short, 9] : null, [full, 8], short ? [short, 8] : null].filter(Boolean);
  for (const [txt, px] of tries){ const r = wrapSpine(txt, cols, max, px); if (r.fit) return { lines: r.lines, px }; }
  return { lines: wrapSpine(short || full, cols, max, 8).lines, px: 8 };
}

/* ---------- Gesichter und Tage (Version 13) ----------
   Ein Foto (`foto` = Asset-ID) und Tage (`tage` = [{was, tag: MM-TT, jahr}]) an einem Thema des Ideenbretts (felder), an einer Person (personen)
   oder an einem Bereich, der ein Mensch ist (areas, z. B. Sophia). Fotos lädt die Seite über die Fähigkeit `assets` hoch (rund zugeschnitten, 480 px);
   angezeigt wird `/_blob/<id>`, leicht sepia, beim Darüberfahren in Farbe. Eine Woche vor einem Tag erscheint auf „Vorne“ eine kleine Marke. */
const FOTO_PX = 480;
const TAG_ARTEN = ['Geburtstag', 'Jahrestag', 'Namenstag'];
function fotoUrl(id){ return /^[A-Za-z0-9._~-]{8,128}$/.test(String(id || '')) ? '/_blob/' + encodeURIComponent(id) : ''; }
function phHTML(id, alt, cls){ const u = fotoUrl(id); return u ? '<span class="ph' + (cls ? ' ' + cls : '') + '"><img src="' + esc(u) + '" alt="' + esc(alt || '') + '" loading="lazy" decoding="async"></span>' : ''; }
function avatarHTML(x, name, colorKey, cls){
  if (x && fotoUrl(x.foto)) return phHTML(x.foto, '', cls);
  return '<span class="ini' + (cls ? ' ' + cls : '') + '" style="--c:' + cvar(colorKey) + '" aria-hidden="true">' + esc(initials(name)) + '</span>';
}
function headMark(a){ return a && fotoUrl(a.foto) ? phHTML(a.foto, '', 'hd') : '<i class="dot"></i>'; }
function leap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function parseTag(s){
  const v = String(s || '').trim().replace(/\s+/g, '');

    if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return undefined;
    const lim = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo - 1];
    if (d > lim || (y && mo === 2 && d === 29 && !leap(y))) return undefined;
    if (y != null && (y < 1900 || y > 2100)) return undefined;
    return { tag: pad(mo) + '-' + pad(d), jahr: y || null };
  };
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return mk(+m[3], +m[2], +m[1]);
  m = v.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
  if (m){ let y = m[3] ? +m[3] : null; if (y != null && y < 100){ const cy = new Date().getFullYear(); y += (2000 + y) <= cy + 20 ? 2000 : 1900; } return mk(+m[1], +m[2], y); }
  return undefined;
}
function fmtTag(d){ return d.tag.slice(3, 5) + '.' + d.tag.slice(0, 2) + '.' + (d.jahr ? d.jahr : ''); }
function tageOf(x){ return (x && Array.isArray(x.tage) ? x.tage : []).filter(d => d && /^\d{2}-\d{2}$/.test(String(d.tag)) && String(d.was || '').trim()); }
function nextOcc(tag, t){
  const y = +t.slice(0, 4);
  for (const yy of [y, y + 1, y + 2]){ const md = tag === '02-29' && !leap(yy) ? '02-28' : tag; const s = yy + '-' + md; if (s >= t) return s; }

}
function tagLong(d){ const mo = +d.tag.slice(0, 2), dd = +d.tag.slice(3, 5); return dd + '. ' + MONL[mo - 1]; }
function tagLabel(d, iso){

}
function tagSource(kind, id){
  if (kind === 'area'){ const a = areaById(id); return a ? { x: a, name: a.name, color: COLORS.includes(a.color) ? a.color : 'petrol', areaId: a.id } : null; }
  if (kind === 'feld'){ const f = feldById(id); return f ? { x: f, name: f.name, color: feldColorKey(f), areaId: f.areaId } : null; }
  if (kind === 'person'){ const p = personById(id); return p ? { x: p, name: p.name, color: pColorKey(p), areaId: p.areaId } : null; }
  return null;
}
function allTage(t){
  const out = [];
  const add = (kind, src) => tageOf(src.x).forEach(d => { const s = nextOcc(d.tag, t); out.push({ kind, id: src.x.id, src, d, iso: s, in: diff(t, s) }); });
  S.areas.forEach(a => add('area', tagSource('area', a.id)));
  S.felder.forEach(f => { const a = areaById(f.areaId); if (a && patternOf(a) === 'raum') add('feld', tagSource('feld', f.id)); });
  S.personen.forEach(p => add('person', tagSource('person', p.id)));
  return out.sort((p, q) => p.in - q.in || String(p.src.name).localeCompare(String(q.src.name), 'de'));
}
function nextTagOf(x, t){ const ds = tageOf(x).map(d => ({ d, iso: nextOcc(d.tag, t) })).sort((p, q) => p.iso < q.iso ? -1 : 1); return ds[0] || null; }

/* Ideen zu einem Tag: Thema einer Person → ihre Ideen; Bereich (z. B. Sophia) → Ideen in Geschenk-Themen; Person der Fäden → ihre Ideen-Fäden */

/* Foto wählen und rund zuschneiden: Zustand des offenen Formulars */
const FO = { bmp: null, zoom: 1, ox: 0, oy: 0, del: false, drag: null };
function foReset(){ if (FO.bmp && FO.bmp.close){ try { FO.bmp.close(); } catch(e){} } FO.bmp = null; FO.zoom = 1; FO.ox = 0; FO.oy = 0; FO.del = false; FO.drag = null; }
function foGeom(size){
  const b = FO.bmp, s = Math.max(size / b.width, size / b.height) * FO.zoom;
  const w = b.width * s, h = b.height * s;
  const mx = (w - size) / 2 / size, my = (h - size) / 2 / size;
  FO.ox = Math.max(-mx, Math.min(mx, FO.ox)); FO.oy = Math.max(-my, Math.min(my, FO.oy));
  return { x: (size - w) / 2 + FO.ox * size, y: (size - h) / 2 + FO.oy * size, w, h };
}
function foDraw(){
  const cv = $('#foCv'); if (!cv || !FO.bmp) return;
  const ctx = cv.getContext('2d'), n = cv.width, g = foGeom(n);
  ctx.clearRect(0, 0, n, n); ctx.drawImage(FO.bmp, g.x, g.y, g.w, g.h);
  const mi = $('#foMini'); if (mi){ const mc = mi.getContext('2d'), m = mi.width, h = foGeom(m); mc.clearRect(0, 0, m, m); mc.drawImage(FO.bmp, h.x, h.y, h.w, h.h); }
}
async function foPick(file){
  if (!file) return;
  if (!/^image\/(jpeg|png|webp|gif)$/i.test(file.type || '')){ toast('Bitte ein Foto als JPG, PNG oder WebP wählen.'); return; }
  let bmp = null;
  try { bmp = await createImageBitmap(file); } catch(e){ bmp = null; }
  if (!bmp){ toast('Das Foto ließ sich nicht öffnen.'); return; }
  foReset(); FO.bmp = bmp;
  const c = $('#foCrop'); if (c) c.hidden = false;
  const z = $('#foZoom'); if (z) z.value = '1';
  const pv = $('#foPrev'); if (pv) pv.innerHTML = '<canvas id="foMini" width="128" height="128" aria-hidden="true"></canvas>';
  foDraw();
}
function foBlob(){
  return new Promise((res, rej) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = FOTO_PX;
    const ctx = cv.getContext('2d'), g = foGeom(FOTO_PX);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, FOTO_PX, FOTO_PX);
    ctx.drawImage(FO.bmp, g.x, g.y, g.w, g.h);
    cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.86);
  });
}
function assetErr(e){
  const c = e && e.code;
  if (c === 'too_large') return 'Das Foto ist zu groß.';
  if (c === 'unsupported_type') return 'Dieses Bildformat geht nicht; bitte JPG oder PNG.';
  if (c === 'quota_or_state') return 'Der Speicher für Fotos ist voll.';
  if (c === 'not_granted' || c === 'capability_disabled') return 'Fotos lassen sich in dieser Ansicht nicht speichern.';
  return 'Foto nicht gespeichert' + (c ? ' (' + c + ')' : '') + '.';
}
/* Vor dem Speichern: neues Foto hochladen; Rückgabe {foto, old} oder null (unverändert) */
async function fotoCommit(oldId){
  if (FO.bmp){
    if (!S.assets){ toast('Fotos lassen sich in dieser Ansicht nicht speichern.'); throw new Error('noassets'); }
    const blob = await foBlob();
    let r = null;
    try { r = await S.assets.upload(blob, { type: 'image/jpeg' }); }
    catch(e){ if (e && e.code === 'store_unavailable'){ await sleep(700); try { r = await S.assets.upload(blob, { type: 'image/jpeg' }); } catch(e2){ toast(assetErr(e2)); throw e2; } } else { toast(assetErr(e)); throw e; } }
    return { foto: r.id, old: oldId || null };
  }
  if (FO.del && oldId) return { foto: null, old: oldId };
  return null;
}
async function fotoCleanup(fo){ foReset(); if (fo && fo.old && S.assets){ try { await S.assets.delete(fo.old); } catch(e){} } }
/* Schreiben gescheitert: das gerade hochgeladene Foto wieder entfernen */
async function fotoUndo(fo){ if (fo && fo.foto && S.assets){ try { await S.assets.delete(fo.foto); } catch(e){} } }
/* Meilenstein-Zeile im Projekt-Formular (Version 16): Text, Soll-Datum, Entfernen; ohne Pipe-Syntax */

/* Tage aus dem Formular lesen; undefined = Fehler (Hinweis schon gezeigt) */
function readTage(form){

/* ---------- Wochenrückblick (Version 13): sonntags die laufende, montags die vergangene Woche ---------- */
function reviewOf(t){
  const dow = new Date(ts(t)).getUTCDay();
  if (dow !== 0 && dow !== 1) return null;
  const end = dow === 0 ? t : addDays(t, -1), start = addDays(end, -6);
  if (load('wr.hide') === start) return null;
  const inW = s => isISO(s) && s >= start && s <= end;
  const per = new Map();
  const bump = aid => { if (aid) per.set(aid, (per.get(aid) || 0) + 1); };
  const lines = [];
  let nMoves = 0, nMs = 0;
  S.moves.filter(m => inW(m.date)).forEach(m => { const p = projById(m.projectId), a = p ? areaOf(p) : null; bump(a ? a.id : null); nMoves++; });
  S.projects.forEach(p => (Array.isArray(p.milestones) ? p.milestones : []).forEach(m => { if (m && inW(m.doneAt)){ nMs++; lines.push({ c: colorOf(p), text: 'Meilenstein erreicht: ' + m.text + ' (' + p.name + ')' }); } }));
  const countBy = (xs, label1, labelN) => {
    const by = new Map(); xs.forEach(x => by.set(x.areaId, (by.get(x.areaId) || 0) + 1));
    by.forEach((n, aid) => { const a = areaById(aid); bumpN(aid, n); lines.push({ c: cvar(a ? a.color : 'petrol'), text: n + ' ' + (n === 1 ? label1 : labelN) + (a ? ' · ' + a.name : '') }); });
  };
  const bumpN = (aid, n) => { if (aid) per.set(aid, (per.get(aid) || 0) + n); };
  countBy(S.gedanken.filter(g => inW(g.doneAt)), 'Idee umgesetzt', 'Ideen umgesetzt');
  countBy(S.faeden.filter(f => inW(f.doneAt)), 'Faden erledigt', 'Fäden erledigt');
  countBy(S.dokumente.filter(d => inW(dayOf(d.createdAt))), 'neuer Band', 'neue Bände');
  taktWeekLines(start).forEach(x => { bumpN(x.areaId, x.n); lines.push(x); });
  return { start, end, now: dow === 0, per, lines, nMoves, nMs };
}
/* Kurzfassung für die eine Zeile am Handy: „3 Meilensteine · 30 Bewegungen · 2 Ideen umgesetzt“ */
function reviewSummary(r){
  const xs = [];
  if (r.nMs) xs.push(r.nMs + (r.nMs === 1 ? ' Meilenstein' : ' Meilensteine'));
  if (r.nMoves) xs.push(r.nMoves + (r.nMoves === 1 ? ' Bewegung' : ' Bewegungen'));
  const rest = r.lines.filter(x => !/^Meilenstein erreicht/.test(x.text)).length;
  if (rest) xs.push(rest + ' weitere');
  return xs.length ? xs.join(' · ') : 'nichts eingetragen';
}
function reviewHTML(t){
  const r = reviewOf(t); if (!r) return '';
  const cols = areaList().filter(a => r.per.get(a.id)).map(a => ({ a, n: r.per.get(a.id) }));
  const mx = cols.reduce((m, x) => Math.max(m, x.n), 1);
  const span = fDM(r.start) + '–' + fDM(r.end);
  const head = (r.now ? 'Diese Woche' : 'Letzte Woche') + ' · KW ' + isoWeek(r.start) + ' · ' + span;
  /* am Handy zunächst eine Zeile (Kurzfassung), ein Tipp klappt auf */
  return '<section class="wr' + (S.wrOpen ? ' open' : '') + '" aria-label="Wochenrückblick">' +
    '<button class="wr-sum" type="button" data-act="wr-toggle" aria-expanded="' + !!S.wrOpen + '" aria-label="' + esc(head + ': ' + reviewSummary(r)) + '"><span class="k">' + esc('KW ' + isoWeek(r.start)) + '</span><span class="s">' + esc(reviewSummary(r)) + '</span>' + CHEV_D + '</button>' +
    '<div class="wr-h"><p class="k">' + esc(head) + '</p>' +

  L.push('- {"typ":"unklar","frage":"ein kurzer Satz, was fehlt"} – wenn etwas nicht sicher passt.');
  L.push('Jeder Eintrag hat zusätzlich "ziel": wohin er kommt, kurz auf Deutsch (z. B. "Sophia · Geschenke"). Nur IDs aus den Listen. Relative Daten (morgen, Freitag, bis Januar) in JJJJ-MM-TT umrechnen.');

/* Wartet-auf-Eintrag zu einem Namen finden (Groß-/Kleinschreibung und Akzente egal; bei mehreren der mit passendem „worauf“) */
function waitIndex(p, who, what){
  const ws = Array.isArray(p && p.waitingOn) ? p.waitingOn : [];
  const n = norm(who).trim(), w = norm(what).trim();
  if (!n) return -1;
  const hits = ws.map((x, k) => ({ x, k })).filter(o => o.x && o.x.who && (norm(o.x.who).trim() === n || norm(o.x.who).includes(n) || n.includes(norm(o.x.who).trim())));
  if (!hits.length) return -1;
  const exact = w ? hits.find(o => norm(o.x.what || '').trim() === w) || hits.find(o => w && norm(o.x.what || '').includes(w)) : null;
  return (exact || hits[0]).k;
}
function qnCheckOne(r){

  const t = today();

  if (r.typ === 'bewegung'){ const p = projById(s(r.projectId)); if (!p || !s(r.text)) return { typ: 'unklar', frage: 'Welches Projekt?' }; o.projectId = p.id; o.text = s(r.text).slice(0, 140); o.date = isISO(r.date) && r.date <= t ? r.date : t; }
  else if (r.typ === 'meilenstein'){
    const p = projById(s(r.projectId)), mi = p ? msInfo(p) : null;
    let i = parseInt(r.nr, 10) - 1;
    if (mi && !(i >= 0 && mi.ms[i]) && s(r.text)) i = mi.ms.findIndex(m => norm(m.text) === norm(r.text));
    if (!mi || !(i >= 0) || !mi.ms[i]) return { typ: 'unklar', frage: 'Welcher Meilenstein ist erreicht?' };
    if (mi.ms[i].doneAt) return { typ: 'unklar', frage: '„' + mi.ms[i].text + '“ steht schon auf erreicht.' };
    o.projectId = p.id; o.i = i; o.text = mi.ms[i].text; o.date = isISO(r.date) && r.date <= t ? r.date : t;
  }
  else if (r.typ === 'wartet'){
    const p = projById(s(r.projectId)), who = s(r.who).slice(0, 40), what = s(r.what).slice(0, 120);
    if (!p || !who) return { typ: 'unklar', frage: 'Bei welchem Projekt, und auf wen?' };
    o.projectId = p.id; o.aktion = r.aktion === 'erledigt' ? 'erledigt' : 'neu'; o.who = who; o.what = what;
    if (o.aktion === 'erledigt'){
      const k = waitIndex(p, who, what);
      if (k < 0) return { typ: 'unklar', frage: 'Bei ' + p.name + ' steht nichts zu „' + who + '“.' };
      o.who = p.waitingOn[k].who; o.what = p.waitingOn[k].what || '';
    }
  }
  else if (r.typ === 'status'){
    const p = projById(s(r.projectId)), st = ['aktiv', 'wartet', 'geparkt'].includes(r.status) ? r.status : null;
    if (!p || !st) return { typ: 'unklar', frage: 'Welches Projekt, welcher Status?' };
    const bis = isISO(r.bis) && r.bis > t ? r.bis : null;
    if (st === 'geparkt' && !bis) return { typ: 'unklar', frage: 'Bis wann soll ' + p.name + ' ruhen?' };
    if ((p.status || 'aktiv') === st && !bis) return { typ: 'unklar', frage: p.name + ' steht schon auf „' + stLabel(st) + '“.' };

/* ---------- Balken ziehen (Version 13): Reihenfolge in einer Liste, Maus ab 6 px senkrecht, Finger lang drücken ---------- */
/* Neue Reihenfolge mit möglichst wenigen Schreibvorgängen: ein verschobener Eintrag bekommt eine Zahl zwischen seinen Nachbarn; nur wenn dort kein Platz ist, werden alle neu nummeriert */
function orderPlan(oldIds, newIds, ordOf){
  if (oldIds.length === newIds.length && newIds.some((id, i) => oldIds[i] !== id)){
    let cand = null;
    for (const id of newIds){
      if (oldIds.indexOf(id) === newIds.indexOf(id)) continue;
      const a = oldIds.filter(x => x !== id), b = newIds.filter(x => x !== id);
      if (a.every((x, i) => x === b[i])){ cand = id; break; }
    }
    if (cand){
      const i = newIds.indexOf(cand), a = i > 0 ? ordOf(newIds[i - 1]) : null, b = i < newIds.length - 1 ? ordOf(newIds[i + 1]) : null;
      let v = null;
      if (typeof a === 'number' && typeof b === 'number'){ if (b - a > 0.01) v = Math.round((a + b) / 2 * 1000) / 1000; }
      else if (typeof a === 'number') v = a + 10;
      else if (typeof b === 'number') v = b - 10;
      if (v != null){ const want = {}; newIds.forEach(id => { want[id] = id === cand ? v : ordOf(id); }); return want; }
    }
  }
  const want = {}; newIds.forEach((id, i) => { want[id] = (i + 1) * 10; }); return want;
}
async function saveProjectOrder(ids){
  const all = S.projects.slice().sort(byOrder);
  const pos = ids.map(id => all.findIndex(p => p.id === id)).filter(i => i >= 0).sort((a, b) => a - b);
  if (pos.length !== ids.length) return;
  const seq = all.slice();
  pos.forEach((k, j) => { seq[k] = projById(ids[j]); });
  const prevOrd = {}; S.projects.forEach(p => { prevOrd[p.id] = typeof p.order === 'number' ? p.order : null; });
  const want = orderPlan(all.map(p => p.id), seq.map(p => p.id), id => prevOrd[id]);
  S.pOverride = want; renderCard(); S.focusRow = null;
  clearTimeout(S.pOverrideTimer);
  S.pOverrideTimer = setTimeout(() => { if (S.pOverride === want){ S.pOverride = null; renderCard(); } }, 5000);
  try {
    for (const p of seq){ if (want[p.id] != null && p.order !== want[p.id]) await write(() => S.db.doc('projects/' + p.id).update({ order: want[p.id] })); }
    toast('Reihenfolge gespeichert', null, async () => {
      S.pOverride = null; clearTimeout(S.pOverrideTimer);
      for (const id of Object.keys(prevOrd)){ const p = projById(id); if (p && p.order !== prevOrd[id]) await write(() => S.db.doc('projects/' + id).update({ order: prevOrd[id] })); }
      renderCard();
    });
  } catch(e){ S.pOverride = null; renderCard(); }
}

/* Rückgängig: frühere Werte merken und zurückschreiben (Listen werden ersetzt, Objekte zusammengeführt) */
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
function pick(o, keys){ const r = {}; keys.forEach(k => { r[k] = clone(o ? o[k] : undefined); }); return r; }
/* Rückgängig nur, wenn seitdem niemand sonst dieselben Felder geändert hat (Fachprojekte schreiben in die Projekte) */
const LIVE_KEY = { projects: 'projects', moves: 'moves', events: 'events', areas: 'areas', personen: 'personen', faeden: 'faeden', felder: 'felder', gedanken: 'gedanken', dokumente: 'dokumente', rhythmen: 'rhythmen', pausen: 'pauses', meta: 'meta' };
function liveDoc(path){ const i = path.indexOf('/'); const arr = S[LIVE_KEY[path.slice(0, i)]]; return Array.isArray(arr) ? arr.find(x => x.id === path.slice(i + 1)) || null : null; }
function sameJSON(a, b){ return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }
async function undoWrite(path, before, after){
  const cur = liveDoc(path);
  if (after && cur && Object.keys(after).some(k => k !== 'updatedAt' && !sameJSON(cur[k], after[k]))){ toast('Inzwischen von anderer Seite geändert, nichts zurückgenommen.'); throw new Error('changed'); }
  await write(() => S.db.doc(path).update(before));
}
async function dropDoc(path){ try { await S.db.doc(path).delete(); } catch(e){} }
/* Bewegung eintragen (mit lastMove); Rückgabe: Funktion, die sie wieder entfernt */
async function moveWithUndo(p, date, text){
  const before = pick(p, ['lastMove']), prev = lastMoveOf(p);
  const mid = await addMove(p.id, date, text);
  const upd = (!prev || date >= prev.date) ? { lastMove: { date, text }, updatedAt: today() } : null;
  if (upd) await write(() => S.db.doc('projects/' + p.id).update(upd));
  return async () => { await undoWrite('projects/' + p.id, before, upd); if (mid) await dropDoc('moves/' + mid); };
}
/* Meilenstein setzen oder zurücksetzen; extra: weitere Felder im selben Schreibvorgang (z. B. erreichtFragen) */
async function setMsOf(p, i, doneAt, extra){
  const ms = (Array.isArray(p.milestones) ? p.milestones : []).filter(m => m && m.text).map(m => Object.assign({}, m, { doneAt: m.doneAt || null }));
  if (!ms[i]) return null;
  const before = pick(p, ['milestones', 'lastMove'].concat(extra ? Object.keys(extra) : []));
  ms[i].doneAt = doneAt;
  const upd = Object.assign({ milestones: ms, updatedAt: today() }, extra || {});
  const prev = lastMoveOf(p);
  const text = 'Meilenstein erreicht: ' + ms[i].text;
  const willComplete = !!doneAt && ms.every(m => m.doneAt);
  if (doneAt && (!prev || doneAt >= prev.date)) upd.lastMove = { date: doneAt, text };
  await write(() => S.db.doc('projects/' + p.id).update(upd));
  if (doneAt) S.justDone = { pid: p.id, i, goal: willComplete };
  const mid = doneAt ? await addMove(p.id, doneAt, text) : null;
  const th = themeOf(p);
  const msg = !doneAt ? 'Auf offen gesetzt' : willComplete ? '„' + th.goalQ[0] + '“ ' + th.goalQ[1] : (th.numerals ? th.reach(i + 1) : th.reach(i + 1) + ' · Meilenstein ' + (i + 1) + ' von ' + ms.length);
  return { msg, willComplete, undo: async () => { await undoWrite('projects/' + p.id, before, upd); if (mid) await dropDoc('moves/' + mid); } };
}
/* Status ändern (aus der Notiz): zählt als Bewegung „Status: alt → neu“ */
async function setStatusOf(p, st, bis){
  const t = today(), old = p.status || 'aktiv';
  const before = pick(p, ['status', 'parkedUntil', 'nudgeAt', 'lastMove']);
  const upd = { status: st, updatedAt: t };
  if (st === 'geparkt') upd.parkedUntil = bis;
  if (st === 'wartet') upd.nudgeAt = bis || null;
  const text = old !== st ? 'Status: ' + stLabel(old) + ' → ' + stLabel(st) : (st === 'geparkt' ? 'Geparkt bis ' + fDM(bis) : 'Nachhaken ab ' + fDM(bis));
  const prev = lastMoveOf(p);
  if (!prev || t >= prev.date) upd.lastMove = { date: t, text };
  await write(() => S.db.doc('projects/' + p.id).update(upd));
  const mid = await addMove(p.id, t, text);
  return { msg: text + ' · ' + p.name, undo: async () => { await undoWrite('projects/' + p.id, before, upd); if (mid) await dropDoc('moves/' + mid); } };
}

/* Zu bestätigen: Meilenstein-Fragen der Fachprojekte (erreichtFragen), Planvorschläge, Wartet-auf-Einträge ab 14 Tagen */
function waitAsk(w, t){
  if (!w || !w.who || waitAge(w, t) < 14) return false;
  if (isISO(w.checked) && diff(w.checked, t) - pausedDays(w.checked, t) < 14) return false;
  return true;
}
function confirmItems(t){
  const out = [], ps = S.projects.filter(p => p.status !== 'fertig').sort(byOrder);
  ps.forEach(p => {
    (Array.isArray(p.erreichtFragen) ? p.erreichtFragen : []).forEach((q, k) => { if (q && String(q.text || '').trim()) out.push({ kind: 'ms', p, q, k }); });
    if (planOf(p)) out.push({ kind: 'plan', p });
  });
  ps.forEach(p => (Array.isArray(p.waitingOn) ? p.waitingOn : []).forEach((w, k) => { if (waitAsk(w, t)) out.push({ kind: 'wait', p, w, k }); }));
  return out;
}
function bellLabel(n, q){ return 'Hinweise: ' + (n ? n : 'alles im Fluss') + (q ? ', zu bestätigen: ' + q : ''); }

/* yes: true = Ja (Meilenstein erreicht), false = Noch nicht, null = nur entfernen */
async function cqMs(pid, k, yes){
  const p = projById(pid); if (!p) return;
  const qs = Array.isArray(p.erreichtFragen) ? p.erreichtFragen.slice() : [];
  const q = qs[k]; if (!q) return;
  const rest = qs.filter((x, j) => j !== k);
  if (yes){
    const i = msInfo(p).ms.findIndex(m => m.text === q.text && !m.doneAt);
    if (i < 0){ toast('Dieser Meilenstein steht so nicht mehr offen im Plan.'); return; }
    const t = today(), at = isISO(q.at) && q.at <= t ? q.at : t;
    const r = await setMsOf(p, i, at, { erreichtFragen: rest });
    if (r) toast(r.msg + ' · ' + p.name, r.willComplete ? 5200 : null, r.undo);
    return;
  }
  const before = pick(p, ['erreichtFragen', 'erreichtNein']);
  const upd = { erreichtFragen: rest, updatedAt: today() };
  if (yes === false) upd.erreichtNein = (Array.isArray(p.erreichtNein) ? p.erreichtNein : []).concat([{ text: String(q.text), at: today(), by: String(q.by || '') }]).slice(-10);
  await write(() => S.db.doc('projects/' + p.id).update(upd));
  toast(yes === false ? 'Noch nicht erreicht · ' + p.name : 'Frage entfernt · ' + p.name, null, () => undoWrite('projects/' + p.id, before, upd));
}
async function cqWait(pid, k, done){
  const p = projById(pid); if (!p) return;
  const ws = Array.isArray(p.waitingOn) ? p.waitingOn : [], w = ws[k]; if (!w) return;
  const before = pick(p, ['waitingOn']);
  const list = ws.filter(y => y && y.who).map(y => Object.assign({}, y));
  const j = list.findIndex(y => y.who === w.who && (y.what || '') === (w.what || ''));
  if (j < 0) return;
  if (done) list.splice(j, 1); else list[j].checked = today();
  const upd = { waitingOn: list, updatedAt: today() };
  await write(() => S.db.doc('projects/' + p.id).update(upd));
  toast(done ? 'Erledigt: ' + w.who + ' · ' + p.name : 'Bleibt offen; in 14 Tagen kommt die Frage wieder', null, () => undoWrite('projects/' + p.id, before, upd));
}

function tbStored(){ const m = (S.meta || []).find(x => x && x.id === 'leiste'); return m && Array.isArray(m.slots) ? m.slots.map(String) : null; }
function tbArea(k){ const m = /^area:(.+)$/.exec(String(k || '')); return m ? areaById(m[1]) : null; }
function tbValid(k){ return !!(TB_OPT[k] || tbArea(k)); }
function tbSlots(){
  const st = tbStored() || TB_DEFAULT, out = [];
  for (let i = 0; i < 3; i++){
    let k = st[i];
    if (!tbValid(k) || out.includes(k)){
      const free = d => !out.includes(d) && !st.slice(i + 1, 3).includes(d);
      k = TB_DEFAULT.find(free) || Object.keys(TB_OPT).find(free);
    }
    out.push(k);
  }
  return out;
}

function tbLabelOf(k){ const a = tbArea(k); return a ? a.name : (TB_SHORT[k] || TB_OPT[k] || ''); }
function anySignal(t){ let s = ''; for (const a of S.areas){ const x = areaSignal(a.id, t); if (x === 'crit') return 'crit'; if (x === 'warn') s = 'warn'; } return s; }
function tbSlotHTML(k, i, t, sl){
  const a = tbArea(k);
  let act = '', sig = '', cur = false, style = '';
  if (a){ act = 'data-act="tb-go" data-v="' + esc(a.id) + '"'; sig = areaSignal(a.id, t); cur = S.tab === a.id; style = ' style="--c:' + cvar(a.color) + '"'; }

  else if (k === 'bereiche'){ act = 'data-act="bereiche"'; sig = anySignal(t); cur = S.tab !== 'vorne' && !sl.includes('area:' + S.tab); }

  else if (k === 'wartet'){ act = 'data-act="wartet"'; if (Array.from(peopleMap(t).values()).some(xs => xs.some(x => x.age >= 7))) sig = 'warn'; }

async function saveLeiste(slots){
  const prev = S.meta;
  S.meta = (S.meta || []).filter(x => x.id !== 'leiste').concat([{ id: 'leiste', slots: slots.slice() }]);
  renderBar(); if (S.drawer && S.drawer.mode === 'leiste') renderDrawer(true);
  try { await write(() => S.db.doc('meta/leiste').set({ slots: slots.slice(), updatedAt: today() })); }
  catch(e){ S.meta = prev; renderBar(); if (S.drawer && S.drawer.mode === 'leiste') renderDrawer(true); }
}
async function leistePick(k){
  if (!tbValid(k)) return;
  const sl = tbSlots(), sel = Math.max(0, Math.min(2, S.lsel | 0)), j = sl.indexOf(k);
  if (j === sel) return;
  if (j >= 0) sl[j] = sl[sel];
  sl[sel] = k;
  await saveLeiste(sl);
  const b = document.querySelector('.le-b[data-v="' + CSS.escape(k) + '"]'); if (b) b.focus({ preventScroll: true });
}

  if (pat === 'faeden'){ const np = personsIn(a.id).length, nt = openThreads(a.id).length; return [np ? np + (np === 1 ? ' Mensch' : ' Menschen') : '', nt ? nt + ' offen' : ''].filter(Boolean).join(' · ') || 'Fäden, noch leer'; }
  if (pat === 'bibliothek'){ const nd = docsIn(a.id).length; return nd ? nd + (nd === 1 ? ' Band' : ' Bände') : 'Regal, noch leer'; }
  if (pat === 'takt'){ const rs = rhythmenIn(a.id), n = rs.filter(r => rhSet(r).has(t)).length; return rs.length ? 'heute ' + n + ' von ' + rs.length + (rs.length === 1 ? ' Rhythmus' : ' Rhythmen') : 'Takt, noch leer'; }
  const ps = projectsIn(a.id), live = ps.filter(isLive).length, ideas = ps.filter(p => p.status === 'idee').length, nr = rhythmenIn(a.id).length;

}

/* ---------- Karte der Zusammenhänge (Version 17): Projekte als Punkte im Kreis, Pfeile „liefert an“ in der Farbe des Gebers; ein Tipp hebt hervor, noch einer öffnet das Projekt ---------- */

/* Motto in der Mitte der Rosette: belegt als mittelalterliche Sentenz (Alanus ab Insulis, Liber parabolarum, um 1175: „mille viae ducunt homines per saecula Romam“) */

/* Rosette: Ring mit Bereichsbögen, Münzen auf dem Ring, Bänder vom Geber (breit) zum Nehmer (Spitze); am Handy ein hochkant stehendes Oval */
function karteRosette(nodes, links, sel, t, narrow){
  const cx = 230, RX = 150, RY = narrow ? 235 : 150, cy = narrow ? 265 : 200, HT = narrow ? 545 : 395, NR = narrow ? 13 : 10, FS = narrow ? 15 : 13;
  const f = v => v.toFixed(1);
  const ang = new Map(); nodes.forEach((p, i) => ang.set(p.id, -Math.PI / 2 + i * 2 * Math.PI / nodes.length));
  const pt = (a, dr) => ({ x: cx + (RX - (dr || 0)) * Math.cos(a), y: cy + (RY - (dr || 0)) * Math.sin(a) });
  /* Bereichsbögen auf dem Ring */
  let arcs = '';
  let g0 = 0;
  for (let i = 1; i <= nodes.length; i++){
    const same = i < nodes.length && (areaOf(nodes[i]) || {}).id === (areaOf(nodes[g0]) || {}).id;
    if (!same){
      const a = areaOf(nodes[g0]);
      const a0 = ang.get(nodes[g0].id) - 0.09, a1 = ang.get(nodes[i - 1].id) + 0.09, A = pt(a0), B = pt(a1);
      arcs += '<path class="km-arc" style="--c:' + (a && a.color ? cvar(a.color) : 'var(--faint)') + '" d="M' + f(A.x) + ' ' + f(A.y) + 'A' + RX + ' ' + RY + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + f(B.x) + ' ' + f(B.y) + '"><title>' + esc(a ? a.name : 'Ohne Bereich') + '</title></path>';
      g0 = i;
    }
  }
  /* Bänder */
  const half = (NR * 0.95) / ((RX + RY) / 2);
  let ribbons = '';
  links.forEach(l => {
    const aA = ang.get(l.from), aB = ang.get(l.to); if (aA == null || aB == null) return;
    const A1 = pt(aA - half, NR), A2 = pt(aA + half, NR), B = pt(aB, NR + 2), A = pt(aA, NR);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1, px = -dy / len, py = dx / len;
    const k = 0.55 + 0.25 * (1 - len / (RX + RY));
    const Cx = mx + (cx - mx) * k + px * 10, Cy = my + (cy - my) * k + py * 10;
    const on = sel && (l.from === sel || l.to === sel);
    const p = projById(l.from);
    ribbons += '<path class="km-rb' + (on ? ' on' : '') + '" style="--c:' + colorOf(p) + '" d="M' + f(A1.x) + ' ' + f(A1.y) + 'Q' + f(Cx) + ' ' + f(Cy) + ' ' + f(B.x) + ' ' + f(B.y) + 'Q' + f(Cx) + ' ' + f(Cy) + ' ' + f(A2.x) + ' ' + f(A2.y) + 'Z"><title>' + esc(p.name + ' → ' + projById(l.to).name + (l.label ? ' · ' + l.label : '')) + '</title></path>';
  });
  /* Münzen und Namen */
  let dots = '', minX = 0, maxX = 460;
  nodes.forEach((p, i) => {
    const a = ang.get(p.id), P = pt(a);
    const above = (i % 2 === 0) !== (Math.cos(a) < -0.2);
    const lx = P.x, ly = above ? P.y - NR - 7 : P.y + NR + 7 + FS * 0.8;
    const w = measure(p.name) * FS / 12.5 * 1.15;
    minX = Math.min(minX, lx - w / 2 - 10); maxX = Math.max(maxX, lx + w / 2 + 10);
    dots += karteNodeOpen(p, t, sel, links) + '<circle class="hit" cx="' + f(P.x) + '" cy="' + f(P.y) + '" r="' + (NR + 12) + '"/><circle class="d" cx="' + f(P.x) + '" cy="' + f(P.y) + '" r="' + NR + '"/><text x="' + f(lx) + '" y="' + f(ly) + '" text-anchor="middle">' + esc(p.name) + '</text></g>';
  });
  /* Zahl in der Mitte, das Motto als Inschrift am unteren Innenrand des Rings (wie auf einer Münze) */
  const M0 = pt(2.705, 17), M1 = pt(0.436, 17);
  const num = '<text class="km-num" x="' + cx + '" y="' + (cy + 10) + '" font-size="' + (narrow ? 34 : 28) + '">' + roman(links.length) + '</text>' +
    '<defs><path id="kmMot" d="M' + f(M0.x) + ' ' + f(M0.y) + 'A' + (RX - 17) + ' ' + (RY - 17) + ' 0 0 0 ' + f(M1.x) + ' ' + f(M1.y) + '"/></defs>' +
    '<text class="km-mot" font-size="' + (narrow ? 10 : 8) + '"><title>' + esc('„' + KM_MOTTO.de + '“ · ' + KM_MOTTO.src) + '</title><textPath href="#kmMot" startOffset="50%" text-anchor="middle">' + esc(KM_MOTTO.caps) + '</textPath></text>';
  const ring = '<ellipse class="km-ring" cx="' + cx + '" cy="' + cy + '" rx="' + RX + '" ry="' + RY + '"/><ellipse class="km-ring2" cx="' + cx + '" cy="' + cy + '" rx="' + (RX - 5) + '" ry="' + (RY - 5) + '"/>';
  return '<svg viewBox="' + f(minX) + ' 10 ' + f(maxX - minX) + ' ' + HT + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rosette: ' + nodes.length + ' Projekte, ' + links.length + ' Verbindungen">' + ring + arcs + ribbons + num + dots + '</svg>';
}
/* Arkaden: Säulen in einer Reihe (nach Bereich), Bögen darüber vom Geber zum Nehmer, Pfeil am Ziel; Hin- und Rückweg mit zwei Bögen */
function karteArkaden(nodes, links, sel, t, narrow){
  const n = nodes.length, x0 = 44, x1 = 416, base = 250, top = base - 30;
  const f = v => v.toFixed(1);
  const xs = new Map(); nodes.forEach((p, i) => xs.set(p.id, n > 1 ? x0 + i * (x1 - x0) / (n - 1) : 230));
  const rev = new Set(links.map(l => l.to + '>' + l.from));
  let arcs = '';
  links.forEach(l => {
    const xa = xs.get(l.from), xb = xs.get(l.to); if (xa == null || xb == null) return;
    const r = Math.abs(xb - xa) / 2, ry = rev.has(l.from + '>' + l.to) && xa > xb ? Math.max(10, r - 8) : r;
    const on = sel && (l.from === sel || l.to === sel);
    const p = projById(l.from);
    const head = 'M' + f(xb) + ' ' + (top - 1) + 'L' + f(xb - 4) + ' ' + (top - 10) + 'L' + f(xb + 4) + ' ' + (top - 10) + 'Z';
    arcs += '<g style="--c:' + colorOf(p) + '"><title>' + esc(p.name + ' → ' + projById(l.to).name + (l.label ? ' · ' + l.label : '')) + '</title><path class="km-arch' + (on ? ' on' : '') + '" d="M' + f(xa) + ' ' + (top - 4) + 'A' + f(r) + ' ' + f(ry) + ' 0 0 ' + (xb > xa ? 1 : 0) + ' ' + f(xb) + ' ' + (top - 4) + '"/><path class="km-a' + (on ? ' on' : '') + '" d="' + head + '"/></g>';
  });
  let cols = '';
  nodes.forEach(p => {
    const x = xs.get(p.id);
    cols += karteNodeOpen(p, t, sel, links) + '<circle class="hit" cx="' + f(x) + '" cy="' + (base - 14) + '" r="22"/>' +
      '<rect class="km-col" x="' + f(x - 7) + '" y="' + (base - 30) + '" width="14" height="4" rx="1"/><rect class="km-col" x="' + f(x - 3.5) + '" y="' + (base - 26) + '" width="7" height="26"/><rect class="km-col" x="' + f(x - 7) + '" y="' + base + '" width="14" height="3.5" rx="1"/>' +
      '<text class="rot" x="' + f(x + 4) + '" y="' + (base + 18) + '" transform="rotate(42 ' + f(x + 4) + ' ' + (base + 18) + ')" text-anchor="start">' + esc(p.name) + '</text></g>';
  });
  const line = '<line class="km-base" x1="20" y1="' + (base + 5) + '" x2="440" y2="' + (base + 5) + '"/>';
  return '<svg viewBox="0 0 460 ' + (narrow ? 430 : 410) + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arkaden: ' + nodes.length + ' Projekte, ' + links.length + ' Verbindungen">' + arcs + line + cols + '</svg>';
}

/* ---------- Wischen zwischen den Bereichen: auf der Karte nach links oder rechts (Finger) ---------- */
function tabOrder(){ return ['vorne'].concat(areaList().map(a => a.id), hasOrphans() ? ['_none'] : []); }
function goTab(v, dir){
  if (!v) return;
  if (v === S.tab){ renderBar(); return; }
  S.tab = v; store('tab2', v); S.who = null;
  renderTabs(); renderCard(); renderBar();
  const c = $('#card');
  if (dir && c){ c.classList.remove('sw-l', 'sw-r'); void c.offsetWidth; c.classList.add(dir > 0 ? 'sw-l' : 'sw-r'); setTimeout(() => c.classList.remove('sw-l', 'sw-r'), 260); }
}
const SW = { on: false, x0: 0, y0: 0, t0: 0, dir: 0 };
function swipeBlocked(tg, card){
  if (tg.closest('input,textarea,select,.bi-books,.wr-cols,.md-table,.fo-crop,[data-noswipe]')) return true;
  const board = tg.closest('#rboard'); if (board && !board.classList.contains('stack') && !board.classList.contains('empty')) return true;
  for (let el = tg; el && el !== card; el = el.parentElement){
    if (el.scrollWidth > el.clientWidth + 2){ const ox = getComputedStyle(el).overflowX; if (ox === 'auto' || ox === 'scroll') return true; }
  }
  return false;
}
function swBack(anim){ const c = $('#card'); if (!c) return; c.style.transition = anim ? 'transform .18s ease' : ''; c.style.transform = ''; if (anim) setTimeout(() => { c.style.transition = ''; }, 220); }
document.addEventListener('touchstart', ev => {
  SW.on = false;
  if (ev.touches.length !== 1 || S.drawer || !ready() || DRAG.active || RD.active || RW.active || document.body.classList.contains('qn-open')) return;
  const tg = ev.target; if (!tg || !tg.closest) return;
  const card = tg.closest('#card'); if (!card || swipeBlocked(tg, card)) return;
  const p = ev.touches[0];
  SW.on = true; SW.x0 = p.clientX; SW.y0 = p.clientY; SW.t0 = Date.now(); SW.dir = 0;
}, { passive: true });
document.addEventListener('touchmove', ev => {
  if (!SW.on || ev.touches.length !== 1) return;
  if (RW.active || RD.active || DRAG.active){ SW.on = false; swBack(false); return; }
  const p = ev.touches[0], dx = p.clientX - SW.x0, dy = p.clientY - SW.y0;
  if (!SW.dir){
    if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.6) SW.dir = dx < 0 ? 1 : -1;
    else { if (Math.abs(dy) > 12) SW.on = false; return; }
  }
  const ord = tabOrder(), i = ord.indexOf(S.tab), j = i + SW.dir, can = j >= 0 && j < ord.length;
  const c = $('#card'); if (c){ c.style.transition = 'none'; c.style.transform = 'translateX(' + (dx * (can ? 0.35 : 0.12)).toFixed(1) + 'px)'; }
}, { passive: true });
document.addEventListener('touchend', ev => {
  if (!SW.on) return;
  SW.on = false;
  if (!SW.dir) return;
  const p = ev.changedTouches[0], dx = p.clientX - SW.x0, dy = p.clientY - SW.y0, dt = Date.now() - SW.t0;
  const ord = tabOrder(), i = ord.indexOf(S.tab), j = i + SW.dir;
  if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 900 && j >= 0 && j < ord.length){ swBack(false); goTab(ord[j], SW.dir); }
  else swBack(true);
}, { passive: true });
document.addEventListener('touchcancel', () => { if (SW.on){ SW.on = false; swBack(true); } }, { passive: true });

/* ---------- Sofort da: der letzte Stand aus diesem Browser erscheint sofort, die Daten kommen live nach ---------- */
const CACHE_KEY = 'cache.v16';
const CACHE_COLS = ['areas', 'projects', 'moves', 'events', 'ast', 'pauses', 'personen', 'faeden', 'felder', 'gedanken', 'dokumente', 'rhythmen', 'meta'];
function cacheLoad(){
  let c = null;
  try { c = JSON.parse(load(CACHE_KEY) || 'null'); } catch(e){ c = null; }
  if (!c || c.v !== 1 || !c.d || !Array.isArray(c.d.projects) || !Array.isArray(c.d.areas)) return false;
  CACHE_COLS.forEach(k => { if (Array.isArray(c.d[k])){ S[k] = c.d[k]; S.loaded[k] = true; } });
  S.recStart = isISO(c.rec) ? c.rec : null; S.memo = null;
  return true;
}
/* Sofort da: den Stand höchstens alle 20 Sekunden in den Browser schreiben (die Serialisierung kostet am Handy), dazu immer beim Verlassen der Seite */
let cacheTimer = 0, cacheAt = 0, cacheDirty = false;
function cacheWrite(){
  cacheDirty = false; cacheAt = Date.now();
  if (!S.live.projects || !S.live.areas) return;
  const lim = addDays(today(), -120), d = {};
  CACHE_COLS.forEach(k => { if (S.loaded[k]) d[k] = S[k]; });
  d.moves = S.moves.filter(m => isISO(m.date) && m.date >= lim).slice(0, 600);
  let s = '';
  try { s = JSON.stringify({ v: 1, at: nowStamp(), rec: S.recStart, d }); if (s.length > 1500000){ d.ast = []; s = JSON.stringify({ v: 1, at: nowStamp(), rec: S.recStart, d }); } } catch(e){ return; }
  if (s.length <= 1500000) store(CACHE_KEY, s);
}
function cacheSave(){
  cacheDirty = true; clearTimeout(cacheTimer);
  cacheTimer = setTimeout(cacheWrite, Math.max(1200, 20000 - (Date.now() - cacheAt)));
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cacheDirty){ clearTimeout(cacheTimer); cacheWrite(); } });
window.addEventListener('pagehide', () => { if (cacheDirty){ clearTimeout(cacheTimer); cacheWrite(); } });

/* Zeitband: drei Tage zurück, sechs Wochen voraus; Wochenenden getönt; Lanes wie in der Zeitleiste */
let bandObserver = null;
function watchBand(){
  if (bandObserver){ bandObserver.disconnect(); bandObserver = null; }
  const box = $('#fband'); if (!box) return;
  if (!window.ResizeObserver){ renderBand(); return; }
  let lastW = 0;
  bandObserver = new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if (w !== lastW){ lastW = w; renderBand(); } });
  bandObserver.observe(box);
}
function renderBand(){
  const box = $('#fband'); if (!box) return;
  const W = box.clientWidth; if (!W) return;
  const aid = box.dataset.area;
  const t = today();
  const start = addDays(t, -BAND_BACK), end = addDays(start, BAND_DAYS);
  const dw = W / BAND_DAYS;
  const X = d => Math.max(0, Math.min(W, diff(start, d) * dw));
  const narrow = W < 520;
  let html = '<div class="band-past" style="width:' + X(t).toFixed(1) + 'px"></div>';
  for (let i = 0; i < BAND_DAYS; i++){
    const d = addDays(start, i), wd = new Date(ts(d)).getUTCDay();
    if (wd === 6 || (wd === 0 && i === 0)) html += '<div class="band-we" style="left:' + (i * dw).toFixed(1) + 'px;width:' + ((wd === 6 && i < BAND_DAYS - 1 ? 2 : 1) * dw).toFixed(1) + 'px"></div>';
    if (wd === 1) html += '<div class="band-wk" style="left:' + (i * dw).toFixed(1) + 'px"><span>' + (narrow ? '' : 'KW ') + isoWeek(d) + '</span></div>';
  }
  html += '<div class="band-today" style="left:' + X(t).toFixed(1) + 'px"><span>heute</span></div>';
  const evs = eventsOfArea(aid).filter(e => e.date < end && endOf(e) >= start);
  const lanes = [], top = 26, lh = 29;
  /* Passt der Titel in den Block, steht er darin; sonst steht er neben dem Block (rechts, am Rand links) */
  const items = evs.map(e => {
    const multi = isISO(e.endDate) && e.endDate > e.date;
    const x1 = X(e.date), x2 = multi ? X(addDays(e.endDate, 1)) : Math.min(W, x1 + dw);
    const mw = Math.max(10, x2 - x1 - 2);
    const lw = measure(e.title) + 12;
    const inside = multi && lw <= mw - 6;
    let o0, o1, flip = false;
    if (inside){ o0 = x1; o1 = x1 + mw; }
    else { const full = mw + 6 + lw; if (x1 + full > W){ flip = true; o0 = x1 + mw - full; o1 = x1 + mw; } else { o0 = x1; o1 = x1 + full; } }
    const lane = laneFor(lanes, o0, o1);
    return { e, x1, x2, mw, flip, lane, multi, inside };
  });
  items.forEach(it => {
    const y = top + it.lane * lh;
    const k = KIND[it.e.kind] ? it.e.kind : 'fest';
    const past = endOf(it.e) < t;
    const who = evOwnerName(it.e);
    const tip = esc(it.e.title + ' · ' + fShortY(it.e.date) + (it.multi ? ' bis ' + fShortY(it.e.endDate) : '') + ' · ' + KIND[k] + (who ? ' · ' + who : '') + (past ? ' · vorbei' : ''));
    if (it.inside){
      html += '<button type="button" class="band-blk k-' + k + (past ? ' past' : '') + '" data-act="event" data-id="' + esc(it.e.id) + '" title="' + tip + '" aria-label="' + tip + '" style="--c:' + evColor(it.e) + ';left:' + it.x1.toFixed(1) + 'px;top:' + y + 'px;width:' + it.mw.toFixed(1) + 'px"><span class="lb">' + esc(it.e.title) + '</span></button>';
    } else {
      const pos = it.flip ? 'right:' + Math.max(0, W - it.x1 - it.mw).toFixed(1) + 'px' : 'left:' + it.x1.toFixed(1) + 'px';
      html += '<button type="button" class="band-ev k-' + k + (it.flip ? ' flip' : '') + (past ? ' past' : '') + '" data-act="event" data-id="' + esc(it.e.id) + '" title="' + tip + '" aria-label="' + tip + '" style="--c:' + evColor(it.e) + ';' + pos + ';top:' + y + 'px"><i class="mk" style="width:' + it.mw.toFixed(1) + 'px"></i><span class="lb">' + esc(it.e.title) + '</span></button>';
    }
  });
  if (!evs.length) html += '<p class="band-empty">Keine Pläne in den nächsten sechs Wochen</p>';
  box.style.height = (top + Math.max(1, lanes.length) * lh + 26) + 'px';
  box.innerHTML = html;
}

/* Spur (Zeile) für einen Block von o0 bis o1: die erste, die frei ist, sonst eine neue; beide Zeitleisten nutzen das */
function laneFor(lanes, o0, o1){ let lane = lanes.findIndex(endX => endX < o0 - 8); if (lane < 0){ lane = lanes.length; lanes.push(0); } lanes[lane] = o1; return lane; }
function renderFooter(){ if (!$('#bellPop').hidden) renderPop(); if (S.drawer && S.drawer.mode === 'bereiche') renderDrawer(true); }

/* ---------- Termine (Zeitleiste) ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function measure(s){ mctx.font = '400 12.5px "Hanken Grotesk", system-ui, sans-serif'; return Math.ceil(mctx.measureText(s).width); }
function renderTimeline(){
  const box = $('#tl'); if (!box) return;
  document.querySelectorAll('[data-act="range"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.range)));
  const W = box.clientWidth; if (!W) return;
  const t = today();
  const start = addDays(t, -14), end = addDays(t, S.range === 'long' ? 365 : 90);
  const total = diff(start, end);
  const X = d => Math.max(0, Math.min(W, diff(start, d) / total * W));
  let html = '<div class="tl-past" style="width:' + X(t).toFixed(1) + 'px"></div>';
  const s0 = new Date(ts(start));
  let m = Date.UTC(s0.getUTCFullYear(), s0.getUTCMonth() + 1, 1);
  while (m <= ts(end)){
    const dt = new Date(m);
    html += '<div class="tl-month" style="left:' + X(iso(m)).toFixed(1) + 'px"><span>' + MON[dt.getUTCMonth()] + (dt.getUTCMonth() === 0 ? ' ' + dt.getUTCFullYear() : '') + '</span></div>';
    m = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1);
  }
  html += '<div class="tl-today" style="left:' + X(t).toFixed(1) + 'px"><span>heute</span></div>';
  const evs = S.events.filter(e => isISO(e.date) && e.date <= end && endOf(e) >= start).sort(byDate);
  const lanes = [], top = 26, lh = 29;
  const items = evs.map(e => {
    const x1 = X(e.date), x2 = isISO(e.endDate) ? X(e.endDate) : x1;
    const lw = measure(e.title) + 12;
    let o0, o1, flip = false, lbLeft = 0;
    if (isISO(e.endDate)){ lbLeft = Math.min(x1 + 6, Math.max(0, W - lw)); o0 = Math.min(x1, lbLeft); o1 = Math.max(x2, lbLeft + lw); }
    else { const full = lw + 17; if (x1 - 6 + full > W){ flip = true; o0 = x1 + 6 - full; o1 = x1 + 6; } else { o0 = x1 - 6; o1 = x1 - 6 + full; } }
    const lane = laneFor(lanes, o0, o1);
    return { e, x1, x2, flip, lbLeft, lane };
  });
  items.forEach(it => {
    const y = top + it.lane * lh;
    const k = KIND[it.e.kind] ? it.e.kind : 'fest';
    const c = evColorKey(it.e) ? evColor(it.e) : 'var(--accent)';
    const own = evOwnerName(it.e);
    const tip = esc(it.e.title + ' · ' + fFull(it.e.date) + (isISO(it.e.endDate) ? '–' + fFull(it.e.endDate) : '') + ' · ' + KIND[k] + (own ? ' · ' + own : ''));
    if (isISO(it.e.endDate)){
      const w = Math.max(8, it.x2 - it.x1);
      html += '<button type="button" class="tl-band k-' + k + '" data-act="event" data-id="' + esc(it.e.id) + '" title="' + tip + '" style="--c:' + c + ';left:' + it.x1.toFixed(1) + 'px;top:' + y + 'px;width:' + w.toFixed(1) + 'px"><span class="lb" style="left:' + (it.lbLeft - it.x1).toFixed(1) + 'px">' + esc(it.e.title) + '</span></button>';
    } else if (it.flip){
      html += '<button type="button" class="tl-ev flip k-' + k + '" data-act="event" data-id="' + esc(it.e.id) + '" title="' + tip + '" style="--c:' + c + ';right:' + (W - it.x1 - 6).toFixed(1) + 'px;top:' + y + 'px"><i class="mk"></i><span class="lb">' + esc(it.e.title) + '</span></button>';
    } else {
      html += '<button type="button" class="tl-ev k-' + k + '" data-act="event" data-id="' + esc(it.e.id) + '" title="' + tip + '" style="--c:' + c + ';left:' + (it.x1 - 6).toFixed(1) + 'px;top:' + y + 'px"><i class="mk"></i><span class="lb">' + esc(it.e.title) + '</span></button>';
    }
  });
  box.style.height = (top + Math.max(1, lanes.length) * lh + 26) + 'px';
  box.innerHTML = html;
}
let tlObserver = null;
function watchTimeline(){
  if (tlObserver){ tlObserver.disconnect(); tlObserver = null; }
  const box = $('#tl'); if (!box || !window.ResizeObserver) { renderTimeline(); return; }

function traceSVG(p, t, n, lvl, w, h){
  const dates = new Set(S.moves.filter(m => m.projectId === p.id).map(m => m.date));
  const lm = lastMoveOf(p); if (lm) dates.add(lm.date);
  const step = w / n, base = Math.round(h * 0.6);
  let d = 'M0 ' + base;
  for (let i = 0; i < n; i++){
    const day = addDays(t, -(n - 1 - i));
    const x0 = i * step, c = x0 + step / 2;
    if (dates.has(day)) d += ' L' + (c - 1.8).toFixed(1) + ' ' + base + ' L' + (c - 0.7).toFixed(1) + ' ' + (base + 3) + ' L' + c.toFixed(1) + ' 2 L' + (c + 0.9).toFixed(1) + ' ' + (h - 2) + ' L' + (c + 1.9).toFixed(1) + ' ' + base;
    d += ' L' + (x0 + step).toFixed(1) + ' ' + base;
  }
  return '<svg class="trace t-' + lvl + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + d + '" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

/* Arbeitsstand in der Projektansicht: oben nur „Als Nächstes“ und „Bei dir“, der Rest aufklappbar */
function astSection(p){
  const ast = astOf(p); if (!ast) return '';
  const f = kopfFields(ast.text);
  const next = f['nächster schritt'] || f['naechster schritt'] || '';
  const mine = f['bei rafael'] || f['bei dir'] || '';
  const parts = mine ? mine.split(/;\s+|\s+·\s+/).map(x => x.trim().replace(/[.;]+$/, '')).filter(Boolean) : [];
  let body;
  if (next || parts.length){
    body = '<dl class="ast-k">' +
      (next ? '<dt>Als Nächstes</dt><dd class="next">' + mdInline(esc(next)) + '</dd>' : '') +
      (parts.length ? '<dt>Bei dir</dt><dd>' + (parts.length > 1 ? '<ul>' + parts.map(x => '<li>' + mdInline(esc(x)) + '</li>').join('') + '</ul>' : mdInline(esc(parts[0]))) + '</dd>' : '') +
      '</dl>';
  } else {
    body = '<div class="md">' + md(kopfOf(ast.text).split('\n').filter(l => !/\*\*Pflege:?\*\*/i.test(l)).join('\n')) + '</div>';
  }
  const meta = (isISO(ast.stand) ? 'Stand ' + fDM(ast.stand) : '') + (ast.projekt ? ' · ' + ast.projekt : '');
  return '<section class="dr-sec"><h3>Arbeitsstand<span class="ast-meta">' + esc(meta) + '</span></h3>' + body +
    '<button class="link more" type="button" data-act="ast-toggle">' + (S.astFull ? 'Ganze Notiz ausblenden' : 'Ganze Notiz anzeigen') + '</button>' +
    (S.astFull ? '<div class="md md-full">' + md(ast.text) + '</div>' : '') + '</section>';
}

}

function gcalView(){
  const g = S.gcal || {};
  const imported = new Map(S.events.filter(e => e.gcal && e.gcal.id).map(e => [String(e.gcal.id), e]));
  const cals = (g.cals || []).filter(c => c.id !== g.primary);
  const calSel = '<div class="f"><label for="gCal">Kalender</label><select id="gCal"><option value="">Hauptkalender</option>' +
    cals.map(c => '<option value="' + esc(c.id) + '"' + (g.cal === c.id ? ' selected' : '') + '>' + esc(c.summary || c.id) + '</option>').join('') + '</select></div>';
  let body = '';
  if (g.status === 'loading') body = '<p class="none">Lade Termine …</p>';
  else if (g.status === 'error') body = '<p class="callout err">' + esc(g.err) + '</p><div><button class="btn small" type="button" data-act="gcal-reload">Noch einmal versuchen</button></div>';
  else if (g.status === 'ready'){
    if (!g.events.length) body = '<p class="none">In den nächsten acht Wochen steht hier nichts.</p>';

      let wk = '';
      const fa = areaList().filter(a => patternOf(a) === 'faeden');
      const projOpts = '<optgroup label="Projekte">' + S.projects.filter(p => p.status !== 'fertig').sort(byOrder).map(p => '<option value="p:' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</optgroup>' +

      body = '<ul class="gl">' + g.events.map(x => {
        const w = 'KW ' + isoWeek(x.date);
        const head = w !== wk ? '<li class="wk"><p class="gl-wk">' + w + '</p></li>' : '';
        wk = w;
        const imp = imported.get(x.id);
        const right = imp ? '<button class="link" type="button" data-act="event" data-id="' + esc(imp.id) + '">übernommen</button>'
          : (g.open === x.id ? '<span></span>' : '<button class="btn small" type="button" data-act="gcal-pick" data-v="' + esc(x.id) + '">Übernehmen</button>');
        const form = g.open === x.id && !imp ? '<div class="gl-form"><select id="gProj" aria-label="Gehört zu"><option value="">nichts</option>' + projOpts + '</select>' +
          '<select id="gKind" aria-label="Art"><option value="fest">fester Termin</option><option value="ziel">Ziel</option><option value="ungefaehr">ungefähr</option></select>' +
          '<button class="btn small primary" type="button" data-act="gcal-add" data-v="' + esc(x.id) + '">Eintragen</button><button class="btn small ghost" type="button" data-act="gcal-cancel">Abbrechen</button></div>' : '';
        return head + '<li><div class="gl-r"><span class="gl-d">' + esc(fShort(x.date)) + '</span><span class="gl-t">' + esc(x.title) + '<small>' + esc((x.time || 'ganztägig') + (x.endDate ? ' · bis ' + fShort(x.endDate) : '')) + '</small></span>' + right + '</div>' + form + '</li>';
      }).join('') + '</ul>';
    }
  }
  return '<div class="dr-top"><div class="dr-title"><p class="eyebrow">Termine</p><h2 id="drTitle" tabindex="-1">Aus dem Kalender</h2></div>' + closeBtn() + '</div>' +
    '<div><button class="link" type="button" data-act="dates">← Alle Termine</button></div>' +

    calSel + body;
}

  }

    if (d.id && !f){ if (S.loaded.felder) closeDrawer(); return; }

  }

/* Schließen auf Wunsch (Kreuz, Scrim, Escape): ein ungespeichertes Formular fragt erst */
function drawerDirty(){
  const f = document.querySelector('#drawer form'); if (!f) return false;
  return Array.from(f.querySelectorAll('input, textarea, select')).some(el => {
    if (el.type === 'hidden' || el.type === 'file' || el.type === 'search') return false;
    if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
    if (el.tagName === 'SELECT') return Array.from(el.options).some(o => o.selected !== o.defaultSelected);
    return el.value !== el.defaultValue;
  });

function trapFocus(ev){
  const dr = $('#drawer'); if (!dr || dr.hidden) return;
  const els = Array.from(dr.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
  if (!els.length) return;
  const first = els[0], last = els[els.length - 1], inside = dr.contains(document.activeElement);
  if (ev.shiftKey && (document.activeElement === first || !inside)){ ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && (document.activeElement === last || !inside)){ ev.preventDefault(); first.focus(); }
}

let toastTimer = null;
/* Hinweis unten; mit undo zusätzlich „Rückgängig“ für 8 Sekunden (Version 15) */
function toast(msg, ms, undo, label){
  const el = $('#toast');
  S.undo = typeof undo === 'function' ? undo : null; S.undoLabel = label || '';
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (S.undo ? '<button class="tu" type="button" data-act="undo">' + esc(label || 'Rückgängig') + '</button>' : '');
  el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; S.undo = null; }, S.undo ? 8000 : (ms || 2600));
}
async function runUndo(){
  const fn = S.undo; if (!fn) return;
  S.undo = null; clearTimeout(toastTimer); $('#toast').hidden = true;
  const plain = !!S.undoLabel; S.undoLabel = '';
  try { await fn(); if (!plain) toast('Rückgängig gemacht'); } catch(e){ /* Hinweis wurde schon gezeigt */ }
}
function errMsg(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Konnte nicht speichern: Eintrag ungültig oder zu groß.';
  if (c === 'quota_exceeded') return 'Die Datenbank dieser Seite ist voll (höchstens 5000 Einträge). Daten exportieren und alte Bewegungen löschen.';
  if (c === 'resource_exhausted') return 'Zu viele Änderungen auf einmal. Kurz warten und noch einmal versuchen.';
  return 'Konnte nicht speichern' + (c ? ' (' + c + ')' : '') + '. Seite neu laden und noch einmal versuchen.';
}
/* Sofort da: wer tippt, bevor die Datenbank verbunden ist, wartet kurz auf sie */
let dbReady = null;
const dbWait = new Promise(r => { dbReady = r; });
async function write(fn){
  if (!S.db && !S.unavailable) await Promise.race([dbWait, sleep(8000)]);
  if (!S.db){ toast('Keine Verbindung zur Datenbank. Seite in Claude öffnen.'); throw new Error('nodb'); }
  try { return await fn(); }
  catch(e){
    if (e && e.code === 'unavailable'){ await sleep(400 + Math.random() * 600); try { return await fn(); } catch(e2){ toast(errMsg(e2)); throw e2; } }
    toast(errMsg(e)); throw e;
  }
}

async function acceptPlanOf(p){
  const plan = planOf(p); if (!plan) return null;
  const dfx = planDiff(p, plan);
  const t = today();
  const before = pick(p, ['milestones', 'planProposal', 'planAt', 'lastMove']);
  const milestones = dfx.rows.map(r => { const o = { text: r.text, doneAt: r.doneAt || null }; if (r.due) o.due = r.due; return o; });
  const text = 'Plan übernommen: ' + dfx.nOld + ' → ' + dfx.nNew + ' Meilensteine';
  const upd = { milestones, planProposal: null, planAt: t, updatedAt: t };
  const prev = lastMoveOf(p);
  if (!prev || t >= prev.date) upd.lastMove = { date: t, text };
  await write(() => S.db.doc('projects/' + p.id).update(upd));
  const mid = await addMove(p.id, t, text);
  return async () => { await undoWrite('projects/' + p.id, before, upd); if (mid) await dropDoc('moves/' + mid); };
}

  const plan = planOf(p);

  await write(() => S.db.doc('projects/' + p.id).update(upd));
